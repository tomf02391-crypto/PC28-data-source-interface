<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC28未来数据站</title>
    <style>
        /* ===== 全局重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080c18;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态粒子背景 */
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 主容器 - 高级玻璃效果 */
        .glass-container {
            max-width: 960px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 40px 120px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 0 80px rgba(80, 160, 255, 0.03);
            padding: 32px 36px 40px;
            color: #eef4fc;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .glass-container::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: conic-gradient(from 0deg, transparent, rgba(80, 180, 255, 0.04), transparent, rgba(200, 130, 255, 0.04), transparent);
            animation: rotateGlow 40s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .glass-container > * { position: relative; z-index: 1; }

        /* ----- 头部 ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 20px rgba(100, 200, 255, 0.15));
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #8fcbff, #c8a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        .header .badge {
            font-size: 11px;
            background: rgba(100, 200, 255, 0.1);
            border: 1px solid rgba(100, 200, 255, 0.15);
            padding: 4px 14px;
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cdb7b;
            display: inline-block;
            animation: pulse-dot 1.5s ease-in-out infinite;
            box-shadow: 0 0 16px rgba(76, 219, 123, 0.3);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .status-dot.paused { background: #f5a623; animation: none; box-shadow: 0 0 16px rgba(245, 166, 35, 0.2); }

        /* ----- 状态栏 ----- */
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .status-info {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
        }
        .status-info .label { color: rgba(255, 255, 255, 0.25); }
        .status-info .value { color: rgba(255, 255, 255, 0.7); font-weight: 500; }
        .btn-group { display: flex; gap: 8px; }
        .btn {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary {
            background: rgba(100, 200, 255, 0.08);
            border-color: rgba(100, 200, 255, 0.15);
            color: rgba(100, 200, 255, 0.8);
        }
        .btn-primary:hover {
            background: rgba(100, 200, 255, 0.15);
            border-color: rgba(100, 200, 255, 0.25);
        }
        .error-msg {
            background: rgba(255, 80, 80, 0.08);
            color: #ff7a7a;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            display: none;
            border: 1px solid rgba(255, 80, 80, 0.06);
        }

        /* ----- 倒计时卡片（强化） ----- */
        .countdown-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            margin: 18px 0 22px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }
        .countdown-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .countdown-left .icon { font-size: 24px; }
        .countdown-left .label {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.3px;
        }
        .countdown-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .countdown-ring-wrap {
            position: relative;
            width: 64px;
            height: 64px;
        }
        .countdown-ring-wrap svg {
            transform: rotate(-90deg);
            width: 64px;
            height: 64px;
        }
        .countdown-ring-wrap .bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.04);
            stroke-width: 5;
        }
        .countdown-ring-wrap .progress {
            fill: none;
            stroke: #8fcbff;
            stroke-width: 5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        .countdown-ring-wrap .progress.warning { stroke: #ff7a7a; }
        .countdown-ring-wrap .time-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f0f6fe;
        }
        .countdown-ring-wrap .time-text.warning { color: #ff7a7a; }

        /* ----- 三球展示（大号霓虹） ----- */
        .balls-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 0 16px;
            margin-bottom: 16px;
        }
        .ball-glow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .ball-glow .num {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 800;
            background: radial-gradient(circle at 30% 30%, rgba(100, 200, 255, 0.15), rgba(20, 60, 120, 0.2));
            border: 1px solid rgba(100, 200, 255, 0.15);
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.05);
            color: #eef4fc;
            transition: 0.3s;
        }
        .ball-glow .num.special-num {
            background: radial-gradient(circle at 30% 30%, rgba(255, 180, 100, 0.15), rgba(180, 80, 30, 0.15));
            border-color: rgba(255, 180, 100, 0.2);
            box-shadow: 0 0 50px rgba(255, 180, 100, 0.08);
            color: #ffba7a;
            font-size: 38px;
        }
        .ball-glow .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
        }
        .ball-glow .label.highlight { color: rgba(255, 180, 100, 0.4); }
        .balls-display .operator {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.1);
            font-weight: 300;
        }
        .balls-display .equals {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }
        .balls-display .result-sum {
            font-size: 32px;
            font-weight: 700;
            color: #ffd54f;
            text-shadow: 0 0 40px rgba(255, 213, 79, 0.1);
            min-width: 50px;
            text-align: center;
        }

        /* ----- 组合标签 ----- */
        .combination-tag {
            text-align: center;
            margin-bottom: 22px;
            padding: 8px 0;
        }
        .combination-tag .tag {
            display: inline-block;
            padding: 6px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: rgba(100, 200, 255, 0.04);
            border: 1px solid rgba(100, 200, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
        }
        .combination-tag .tag .highlight {
            color: #ffd54f;
        }

        /* ----- 术语网格 ----- */
        .terms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px 12px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 20px;
        }
        .term-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .term-item:last-child { border-bottom: none; }
        .term-item .key { color: rgba(255, 255, 255, 0.25); font-weight: 400; }
        .term-item .val { color: rgba(255, 255, 255, 0.75); font-weight: 500; }

        /* ----- 历史记录 ----- */
        .history-section {
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin-top: 16px;
        }
        .history-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .history-table th {
            text-align: left;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .history-table td {
            padding: 4px 8px;
            color: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.015);
        }
        .history-table .latest td { color: rgba(255, 255, 255, 0.8); }

        /* ----- 底部 ----- */
        .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.3px;
        }
        .footer code {
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }

        /* 20个号码（旧格式兼容） */
        .old-balls {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 16px;
            display: none;
        }
        .old-balls.show { display: block; }
        .old-balls .title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 10px;
        }
        .old-balls .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .old-balls .grid .b {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }
        .old-balls .grid .b.hl {
            border-color: rgba(100, 200, 255, 0.15);
            color: rgba(100, 200, 255, 0.5);
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .glass-container { padding: 20px 16px; border-radius: 32px; }
            .header h1 { font-size: 22px; }
            .balls-display { gap: 12px; flex-wrap: wrap; }
            .ball-glow .num { width: 56px; height: 56px; font-size: 26px; }
            .ball-glow .num.special-num { font-size: 30px; }
            .countdown-card { padding: 14px 18px; }
            .countdown-ring-wrap { width: 52px; height: 52px; }
            .countdown-ring-wrap .time-text { font-size: 18px; }
            .terms-grid { grid-template-columns: 1fr 1fr; padding: 12px 14px; }
            .status-bar { flex-direction: column; align-items: stretch; gap: 8px; }
            .status-info { justify-content: center; }
            .btn-group { justify-content: center; }
        }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="glass-container">
    <!-- 头部 -->
    <div class="header">
        <div class="header-left">
            <span class="logo-icon">📡</span>
            <h1>PC28未来数据站</h1>
            <span class="badge">LIVE</span>
        </div>
        <div class="header-right">
            <span class="status-dot" id="statusDot"></span>
            <span style="font-size:13px;color:rgba(255,255,255,0.3);" id="statusLabel">实时</span>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-info">
            <span><span class="label">最后更新</span> <span class="value" id="updateTime">--</span></span>
            <span><span class="label">数据源</span> <span class="value" id="sourceIndicator">data.json</span></span>
            <span class="error-msg" id="errorMsg">⚠️ 加载失败</span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="refreshBtn">🔄 刷新</button>
            <button class="btn" id="toggleBtn">⏸️ 暂停</button>
        </div>
    </div>

    <!-- 倒计时 -->
    <div class="countdown-card">
        <div class="countdown-left">
            <span class="icon">⏳</span>
            <span class="label">距下期开奖</span>
        </div>
        <div class="countdown-right">
            <div class="countdown-ring-wrap">
                <svg viewBox="0 0 64 64">
                    <circle class="bg" cx="32" cy="32" r="27" />
                    <circle class="progress" id="countdownCircle" cx="32" cy="32" r="27"
                        stroke-dasharray="169.65" stroke-dashoffset="0" />
                </svg>
                <div class="time-text" id="countdownDisplay">--:--</div>
            </div>
        </div>
    </div>

    <!-- 三球展示 -->
    <div class="balls-display" id="ballsDisplay">
        <div class="ball-glow">
            <div class="num" id="displayBall1">-</div>
            <span class="label">第1球</span>
        </div>
        <span class="operator">+</span>
        <div class="ball-glow">
            <div class="num" id="displayBall2">-</div>
            <span class="label">第2球</span>
        </div>
        <span class="operator">+</span>
        <div class="ball-glow">
            <div class="num" id="displayBall3">-</div>
            <span class="label">第3球</span>
        </div>
        <span class="equals">=</span>
        <div class="ball-glow">
            <div class="num special-num" id="displaySpecial">-</div>
            <span class="label highlight">特码</span>
        </div>
    </div>

    <!-- 组合标签 -->
    <div class="combination-tag">
        <span class="tag" id="combinationTag">—</span>
    </div>

    <!-- 20个号码（旧格式兼容） -->
    <div class="old-balls" id="oldBallsSection">
        <div class="title">📋 20个开奖号码</div>
        <div class="grid" id="oldBallsGrid"></div>
    </div>

    <!-- 术语 -->
    <div class="terms-grid" id="termsGrid">
        <div class="term-item"><span class="key">单/双</span><span class="val" id="termOddEven">-</span></div>
        <div class="term-item"><span class="key">大/小</span><span class="val" id="termBigSmall">-</span></div>
        <div class="term-item"><span class="key">组合</span><span class="val" id="termCombination">-</span></div>
        <div class="term-item"><span class="key">极值</span><span class="val" id="termExtreme">-</span></div>
        <div class="term-item"><span class="key">顺子</span><span class="val" id="termStraight">-</span></div>
        <div class="term-item"><span class="key">对子</span><span class="val" id="termPair">-</span></div>
        <div class="term-item"><span class="key">豹子</span><span class="val" id="termTriple">-</span></div>
        <div class="term-item"><span class="key">形态</span><span class="val" id="termShape">-</span></div>
    </div>

    <!-- 历史 -->
    <div class="history-section">
        <div class="history-title">📊 最近开奖</div>
        <table class="history-table">
            <thead><tr><th>期号</th><th>开奖</th><th>和值</th><th>组合</th></tr></thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <div class="footer">
        ⚡ 数据每3分钟自动更新 · 前端每3分30秒刷新 · <code>window.PC28_DATA</code> 对外接口
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // Telegram 配置（已填入您的信息）
        // ============================================================
        const TG_CONFIG = {
            botToken: '8415517129:AAGWygn6B9lgvvktbGed1nV-9aebZFIFLwo',
            channelId: '@pc28jndkj',
            groupId: '-1003480986680',
            enabled: true,
        };

        // ============================================================
        // 配置
        // ============================================================
        const REFRESH_INTERVAL = 210000;
        const ROUND_INTERVAL = 210;
        const MAX_HISTORY = 50;

        // ============================================================
        // 粒子背景
        // ============================================================
        (function initParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const particles = Array.from({ length: 60 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.2 + 0.3,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                a: Math.random() * 0.5 + 0.1
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${p.a * 0.3})`;
                    ctx.fill();
                });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255,255,255,${0.04 * (1 - dist/120)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ============================================================
        // DOM 引用
        // ============================================================
        const displayBall1 = document.getElementById('displayBall1');
        const displayBall2 = document.getElementById('displayBall2');
        const displayBall3 = document.getElementById('displayBall3');
        const displaySpecial = document.getElementById('displaySpecial');
        const combinationTag = document.getElementById('combinationTag');
        const updateTimeEl = document.getElementById('updateTime');
        const sourceIndicator = document.getElementById('sourceIndicator');
        const errorMsgEl = document.getElementById('errorMsg');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const toggleBtn = document.getElementById('toggleBtn');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const countdownCircle = document.getElementById('countdownCircle');
        const historyBody = document.getElementById('historyBody');
        const oldBallsSection = document.getElementById('oldBallsSection');
        const oldBallsGrid = document.getElementById('oldBallsGrid');

        // ============================================================
        // 工具
        // ============================================================
        function analyzeTerms(b1, b2, b3, special) {
            const oddEven = special % 2 === 0 ? '双' : '单';
            const bigSmall = special <= 13 ? '小' : '大';
            let combination = '';
            if (special <= 13 && special % 2 === 0) combination = '小双';
            else if (special <= 13 && special % 2 === 1) combination = '小单';
            else if (special > 13 && special % 2 === 0) combination = '大双';
            else if (special > 13 && special % 2 === 1) combination = '大单';
            let extreme = '—';
            if (special >= 0 && special <= 5) extreme = '极小';
            else if (special >= 22 && special <= 27) extreme = '极大';
            const sorted = [b1,b2,b3].slice().sort((a,b)=>a-b);
            const isConsecutive = (sorted[2]-sorted[1]===1 && sorted[1]-sorted[0]===1);
            let straight = '否';
            if (isConsecutive && sorted[0]>=1 && sorted[2]<=9) straight = '是';
            const pair = (b1===b2 || b2===b3 || b1===b3) ? '是' : '否';
            const triple = (b1===b2 && b2===b3) ? '是' : '否';
            let shape = '杂六';
            if (triple === '是') shape = '豹子';
            else if (pair === '是') shape = '对子';
            else if (straight === '是') shape = '顺子';
            return { oddEven, bigSmall, combination, extreme, straight, pair, triple, shape };
        }

        // ============================================================
        // 读取 data.json（兼容新旧格式）
        // ============================================================
        async function fetchRealData() {
            try {
                const resp = await fetch('data.json');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const json = await resp.json();
                if (json.message !== 'success' || !json.data || !json.data[0]) {
                    throw new Error('数据格式错误');
                }
                const item = json.data[0];

                const period = item.nbr || item.id || '未知期号';
                let ball1, ball2, ball3, special;

                // 新格式：有 number 字段 (如 "5+1+1")
                if (item.number && typeof item.number === 'string' && item.number.includes('+')) {
                    const parts = item.number.split('+').map(s => parseInt(s.trim(), 10));
                    if (parts.length === 3) {
                        [ball1, ball2, ball3] = parts;
                        special = (ball1 + ball2 + ball3) % 10;
                    } else {
                        throw new Error('number 字段解析错误');
                    }
                }
                // 旧格式：有 nbrs 字段
                else if (item.nbrs) {
                    let nbrs = [];
                    if (typeof item.nbrs === 'string') {
                        nbrs = item.nbrs.split(/[,;\s|]+/).map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
                    } else if (Array.isArray(item.nbrs)) {
                        nbrs = item.nbrs.map(n => parseInt(n, 10)).filter(n => !isNaN(n));
                    }
                    if (nbrs.length !== 20) {
                        throw new Error(`号码数量不正确，期望20，实际${nbrs.length}`);
                    }
                    nbrs.sort((a, b) => a - b);
                    const idx1 = [1,4,7,10,13,16];
                    const sum1 = idx1.reduce((a,i) => a + (nbrs[i] || 0), 0);
                    ball1 = sum1 % 10;
                    const idx2 = [2,5,8,11,14,17];
                    const sum2 = idx2.reduce((a,i) => a + (nbrs[i] || 0), 0);
                    ball2 = sum2 % 10;
                    const idx3 = [3,6,9,12,15,18];
                    const sum3 = idx3.reduce((a,i) => a + (nbrs[i] || 0), 0);
                    ball3 = sum3 % 10;
                    special = (ball1 + ball2 + ball3) % 10;
                    window._lastNbrs = nbrs;
                } else {
                    throw new Error('既没有 number 也没有 nbrs 字段');
                }

                const date = item.date || '';
                const time = item.time || '';
                const combinationFromApi = item.combination || '';

                return {
                    data: { period, ball1, ball2, ball3, special, date, time, combinationFromApi },
                    sourceName: 'GitHub Actions (本地 data.json)'
                };
            } catch (err) {
                throw new Error('读取本地数据失败: ' + err.message);
            }
        }

        // ============================================================
        // 历史记录
        // ============================================================
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('pc28_history') || '[]'); } catch { return []; }
        }
        function saveHistory(entry) {
            let h = getHistory().filter(x => x.period !== entry.period);
            h.unshift(entry);
            if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
            localStorage.setItem('pc28_history', JSON.stringify(h));
        }
        function renderHistory(history) {
            historyBody.innerHTML = '';
            history.slice(0, 10).forEach((h, i) => {
                const tr = document.createElement('tr');
                if (i === 0) tr.className = 'latest';
                tr.innerHTML = `<td>${h.period}</td><td>${h.ball1}+${h.ball2}+${h.ball3}</td><td>${h.sum}</td><td>${h.combination}</td>`;
                historyBody.appendChild(tr);
            });
        }

        // ============================================================
        // 倒计时
        // ============================================================
        let lastOpenTime = null;
        function updateCountdown(openTime) {
            if (!openTime) { countdownDisplay.textContent = '--:--'; countdownCircle.style.strokeDashoffset = '169.65'; return; }
            const now = Date.now();
            const elapsed = (now - openTime.getTime()) / 1000;
            const rounds = Math.floor(elapsed / ROUND_INTERVAL);
            const nextTime = new Date(openTime.getTime() + (rounds + 1) * ROUND_INTERVAL * 1000);
            const remaining = (nextTime - now) / 1000;
            if (remaining < 0) { countdownDisplay.textContent = '00:00'; countdownCircle.style.strokeDashoffset = '0'; return; }
            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60);
            countdownDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            const progress = 1 - (remaining / ROUND_INTERVAL);
            countdownCircle.style.strokeDashoffset = 169.65 * progress;
            countdownCircle.classList.toggle('warning', remaining < 30);
        }
        setInterval(() => { if (lastOpenTime) updateCountdown(lastOpenTime); }, 1000);

        // ============================================================
        // Telegram 推送
        // ============================================================
        function generateCardImage(data) {
            const { period, ball1, ball2, ball3, terms, date, time } = data;
            const sum = ball1 + ball2 + ball3;
            const combination = terms.combination;
            const shape = terms.shape;
            const dateStr = date && time ? `${date} ${time}` : '未知时间';

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const width = 800, height = 420;
            canvas.width = width; canvas.height = height;

            const grad = ctx.createLinearGradient(0,0,width,height);
            grad.addColorStop(0, '#0f1f2f');
            grad.addColorStop(0.7, '#1a2a4a');
            ctx.fillStyle = grad; ctx.fillRect(0,0,width,height);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 2; ctx.strokeRect(10,10,width-20,height-20);

            ctx.textAlign = 'left';
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.font = '16px "Segoe UI", sans-serif';
            ctx.fillText('PC28 开奖结果', 30, 50);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`第 ${period} 期`, width-30, 50);

            const circleY = 150, radius = 50, spacing = 130;
            const startX = (width - 2*spacing)/2 - 10;
            const balls = [ball1, ball2, ball3];
            balls.forEach((num, i) => {
                const x = startX + i * spacing;
                const gradCirc = ctx.createRadialGradient(x-15, circleY-15, 10, x, circleY, radius);
                gradCirc.addColorStop(0, '#6ad4ff');
                gradCirc.addColorStop(1, '#1a7ab5');
                ctx.shadowColor = 'rgba(79,195,247,0.3)';
                ctx.shadowBlur = 20;
                ctx.beginPath(); ctx.arc(x, circleY, radius, 0, Math.PI*2);
                ctx.fillStyle = gradCirc; ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 44px "Segoe UI", sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 8;
                ctx.fillText(num, x, circleY+2);
                ctx.shadowBlur = 0;
                if (i < 2) {
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.font = '32px "Segoe UI", sans-serif';
                    ctx.fillText('+', x + spacing/2, circleY+2);
                }
            });

            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            ctx.fillStyle = '#ffd54f';
            ctx.font = 'bold 36px "Segoe UI", sans-serif';
            ctx.fillText(`= ${sum}`, width/2, circleY + radius + 20);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px "Segoe UI", sans-serif';
            ctx.fillText(combination, width/2, circleY + radius + 70);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '22px "Segoe UI", sans-serif';
            ctx.fillText(`形态：${shape}`, width/2, circleY + radius + 115);
            ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '16px "Segoe UI", sans-serif';
            ctx.fillText(`开奖时间 ${dateStr}`, width-30, height-20);

            return new Promise(resolve => {
                canvas.toBlob(blob => resolve(blob), 'image/png');
            });
        }

        async function sendPhotoToChannel(chatId, photoBlob, caption) {
            if (!TG_CONFIG.enabled || !TG_CONFIG.botToken) return;
            const url = `https://api.telegram.org/bot${TG_CONFIG.botToken}/sendPhoto`;
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('photo', photoBlob, 'result.png');
            if (caption) fd.append('caption', caption);
            fd.append('parse_mode', 'HTML');
            try {
                const r = await fetch(url, { method: 'POST', body: fd });
                const j = await r.json();
                if (!j.ok) console.error('图片发送失败:', j);
                else console.log('图片发送成功');
            } catch (e) { console.error('图片发送异常:', e); }
        }

        async function sendTextToGroup(chatId, text) {
            if (!TG_CONFIG.enabled || !TG_CONFIG.botToken) return;
            const url = `https://api.telegram.org/bot${TG_CONFIG.botToken}/sendMessage`;
            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'HTML', disable_web_page_preview: true })
                });
                const j = await r.json();
                if (!j.ok) console.error('文字发送失败:', j);
                else console.log('文字发送成功');
            } catch (e) { console.error('文字发送异常:', e); }
        }

        function buildGroupMessage(data) {
            const { period, ball1, ball2, ball3, terms, date, time } = data;
            const sum = ball1 + ball2 + ball3;
            const dateStr = date && time ? `${date} ${time}` : '未知时间';
            return `📢 最新开奖信息\n📅 最新期号: ${period}\n🔢 开奖结果: ${ball1}+${ball2}+${ball3}=${sum} ${terms.combination}\n🎉 号码形式: ${terms.shape}|中\n⏰ 开奖时间: ${dateStr}`;
        }

        // ============================================================
        // 对外接口
        // ============================================================
        let latestData = null;
        let lastPushDigest = '';
        window.PC28_DATA = null;

        // ============================================================
        // 主渲染
        // ============================================================
        async function fetchAndRender() {
            errorMsgEl.style.display = 'none';
            try {
                const result = await fetchRealData();
                const { period, ball1, ball2, ball3, special, date, time, combinationFromApi } = result.data;
                const terms = analyzeTerms(ball1, ball2, ball3, special);
                if (combinationFromApi) terms.combination = combinationFromApi;

                const dataObj = { period, ball1, ball2, ball3, special, terms, date, time, sourceName: result.sourceName };
                latestData = dataObj;
                window.PC28_DATA = dataObj;

                displayBall1.textContent = ball1;
                displayBall2.textContent = ball2;
                displayBall3.textContent = ball3;
                displaySpecial.textContent = special;
                combinationTag.innerHTML = `<span class="highlight">${terms.combination}</span> · ${terms.shape}`;

                document.getElementById('termOddEven').textContent = terms.oddEven;
                document.getElementById('termBigSmall').textContent = terms.bigSmall;
                document.getElementById('termCombination').textContent = terms.combination;
                document.getElementById('termExtreme').textContent = terms.extreme;
                document.getElementById('termStraight').textContent = terms.straight;
                document.getElementById('termPair').textContent = terms.pair;
                document.getElementById('termTriple').textContent = terms.triple;
                document.getElementById('termShape').textContent = terms.shape;

                if (window._lastNbrs && window._lastNbrs.length === 20) {
                    oldBallsSection.classList.add('show');
                    oldBallsGrid.innerHTML = '';
                    const hl = new Set([1,4,7,10,13,16]);
                    window._lastNbrs.forEach((n, i) => {
                        const span = document.createElement('span');
                        span.className = 'b' + (hl.has(i) ? ' hl' : '');
                        span.textContent = String(n).padStart(2, '0');
                        oldBallsGrid.appendChild(span);
                    });
                } else {
                    oldBallsSection.classList.remove('show');
                }

                const now = new Date();
                updateTimeEl.textContent = now.toLocaleString('zh-CN', { hour12: false });
                sourceIndicator.textContent = 'data.json';

                if (date && time) {
                    const ot = new Date(`${date} ${time}`);
                    if (!isNaN(ot)) { lastOpenTime = ot; updateCountdown(ot); }
                }

                saveHistory({ period, ball1, ball2, ball3, sum: ball1+ball2+ball3, combination: terms.combination });
                renderHistory(getHistory());

                const digest = `${period}|${ball1}|${ball2}|${ball3}`;
                if (digest !== lastPushDigest && TG_CONFIG.enabled) {
                    lastPushDigest = digest;
                    if (TG_CONFIG.channelId) {
                        const caption = `<b>第${period}期</b> ${ball1}+${ball2}+${ball3}=${ball1+ball2+ball3} ${terms.combination}`;
                        const img = await generateCardImage(dataObj);
                        await sendPhotoToChannel(TG_CONFIG.channelId, img, caption);
                    }
                    if (TG_CONFIG.groupId) {
                        await sendTextToGroup(TG_CONFIG.groupId, buildGroupMessage(dataObj));
                    }
                }

                console.log('[PC28] 数据更新:', dataObj);

            } catch (err) {
                console.error('[PC28] 加载失败:', err);
                errorMsgEl.style.display = 'inline-block';
                errorMsgEl.textContent = '⚠️ ' + err.message;
            }
        }

        // ============================================================
        // 自动刷新
        // ============================================================
        let timer = null;
        let isRunning = true;

        function startAuto() {
            if (timer) clearInterval(timer);
            timer = setInterval(fetchAndRender, REFRESH_INTERVAL);
            isRunning = true;
            statusDot.className = 'status-dot';
            statusLabel.textContent = '实时';
            toggleBtn.textContent = '⏸️ 暂停';
        }

        function stopAuto() {
            if (timer) { clearInterval(timer); timer = null; }
            isRunning = false;
            statusDot.className = 'status-dot paused';
            statusLabel.textContent = '暂停';
            toggleBtn.textContent = '▶️ 继续';
        }

        function toggleAuto() {
            if (isRunning) stopAuto();
            else { startAuto(); fetchAndRender(); }
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchAndRender);
        toggleBtn.addEventListener('click', toggleAuto);

        fetchAndRender().then(startAuto).catch(startAuto);
        window.addEventListener('beforeunload', () => { if (timer) clearInterval(timer); });

        console.log('[PC28] 未来数据站已启动，Telegram推送已启用');
        console.log('  频道ID:', TG_CONFIG.channelId);
        console.log('  群组ID:', TG_CONFIG.groupId);
    })();
</script>
