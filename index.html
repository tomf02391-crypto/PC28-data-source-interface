<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC28未来数据站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 30%, #0d1a2b, #060b14);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #eef4fc;
        }

        .glass-container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 100px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04), 0 0 60px rgba(80,160,255,0.02);
            padding: 28px 32px 36px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        .glass-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(80,180,255,0.04), transparent, rgba(200,130,255,0.04), transparent);
            animation: rotateGlow 35s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .glass-container > * { position: relative; z-index: 1; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #7ec8ff, #b494ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
        }
        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cdb7b;
            display: inline-block;
            animation: pulse-dot 1.5s infinite;
            box-shadow: 0 0 12px rgba(76,219,123,0.2);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .header .status .dot.paused { background: #f5a623; animation: none; box-shadow: 0 0 12px rgba(245,166,35,0.15); }
        .header .status .time-label { color: rgba(255,255,255,0.2); margin-left: 4px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .toolbar .info {
            font-size: 13px;
            color: rgba(255,255,255,0.2);
        }
        .toolbar .info span { color: rgba(255,255,255,0.5); }
        .toolbar .btns { display: flex; gap: 6px; }
        .toolbar .btns button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            backdrop-filter: blur(4px);
        }
        .toolbar .btns button:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.1);
        }
        .toolbar .btns .primary {
            background: rgba(100,200,255,0.06);
            border-color: rgba(100,200,255,0.08);
            color: rgba(100,200,255,0.6);
        }
        .toolbar .btns .primary:hover {
            background: rgba(100,200,255,0.12);
            color: rgba(100,200,255,0.8);
        }
        .toolbar .btns .push-btn {
            background: rgba(255,180,80,0.06);
            border-color: rgba(255,180,80,0.08);
            color: rgba(255,180,80,0.6);
        }
        .toolbar .btns .push-btn:hover {
            background: rgba(255,180,80,0.12);
            color: rgba(255,180,80,0.8);
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            display: none;
            margin-left: 10px;
        }
        .push-msg {
            color: #6bff9e;
            font-size: 13px;
            display: none;
            margin-left: 10px;
        }

        .countdown-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 20px 30px;
            margin: 10px 0 22px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .countdown-card .label {
            font-size: 15px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .countdown-card .label .icon { font-size: 22px; }
        .countdown-card .time {
            font-size: 44px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8fcbff, #b494ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-width: 140px;
            text-align: right;
        }
        .countdown-card .time.warning {
            background: linear-gradient(135deg, #ffb07a, #ff7a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .countdown-card .next-period {
            margin-top: 6px;
            font-size: 13px;
            color: rgba(255,255,255,0.55);
            letter-spacing: 1px;
        }

        .balls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 22px 0 14px;
            flex-wrap: wrap;
        }
        .balls-row .ball-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .balls-row .ball-item .num {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 0 30px rgba(255,255,255,0.02);
            color: #eef4fc;
            transition: 0.3s;
        }
        .balls-row .ball-item .num.special {
            border-color: rgba(255,200,100,0.12);
            background: rgba(255,200,100,0.03);
            color: #ffd54f;
            box-shadow: 0 0 40px rgba(255,200,100,0.04);
        }
        .balls-row .ball-item .label {
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
        }
        .balls-row .op {
            font-size: 24px;
            color: rgba(255,255,255,0.05);
            font-weight: 300;
        }
        .balls-row .eq {
            font-size: 24px;
            color: rgba(255,255,255,0.06);
            font-weight: 300;
        }
        .balls-row .sum {
            font-size: 30px;
            font-weight: 700;
            color: #ffd54f;
            min-width: 44px;
            text-align: center;
            text-shadow: 0 0 30px rgba(255,213,79,0.05);
        }

        .combo-tag {
            text-align: center;
            padding: 6px 0 18px;
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
        }
        .combo-tag strong {
            background: linear-gradient(135deg, #ffd54f, #ffb07a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .terms-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 28px;
            padding: 14px 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            margin-bottom: 20px;
        }
        .terms-row .item {
            font-size: 13px;
            color: rgba(255,255,255,0.2);
        }
        .terms-row .item span {
            color: rgba(255,255,255,0.7);
            font-weight: 500;
            margin-left: 6px;
        }

        .history-section {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
            margin-top: 4px;
        }
        .history-section .title {
            padding: 14px 20px 10px;
            font-size: 13px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .history-table th {
            text-align: left;
            padding: 8px 16px;
            color: rgba(255,255,255,0.12);
            font-weight: 400;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .history-table td {
            padding: 7px 16px;
            color: rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.01);
            font-size: 13px;
        }
        .history-table tr:last-child td { border-bottom: none; }
        .history-table .latest td {
            color: rgba(255,255,255,0.8);
        }
        .history-table .latest .highlight {
            color: #ffd54f;
        }
        .history-table .col-period { width: 20%; }
        .history-table .col-result { width: 26%; }
        .history-table .col-sum { width: 16%; }
        .history-table .col-combo { width: 20%; }
        .history-table .col-shape { width: 18%; }

        .footer {
            text-align: center;
            padding: 20px 0 4px;
            font-size: 11px;
            color: rgba(255,255,255,0.06);
            letter-spacing: 0.5px;
        }
        .footer code {
            background: rgba(255,255,255,0.03);
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 10px;
            color: rgba(255,255,255,0.08);
        }

        @media (max-width: 640px) {
            .glass-container { padding: 18px 16px 24px; border-radius: 28px; }
            .countdown-card .time { font-size: 32px; min-width: 100px; }
            .countdown-card { padding: 16px 20px; }
            .balls-row .ball-item .num { width: 58px; height: 58px; font-size: 26px; }
            .balls-row { gap: 10px; }
            .history-table { font-size: 12px; }
            .history-table th, .history-table td { padding: 5px 10px; }
            .header h1 { font-size: 20px; }
            .terms-row { gap: 6px 16px; padding: 10px 14px; }
            .terms-row .item { font-size: 12px; }
        }
        @media (max-width: 420px) {
            .countdown-card { flex-direction: column; align-items: stretch; text-align: center; }
            .countdown-card .time { text-align: center; font-size: 28px; }
            .balls-row .ball-item .num { width: 48px; height: 48px; font-size: 20px; }
            .balls-row { gap: 6px; }
            .balls-row .op, .balls-row .eq { font-size: 16px; }
            .history-table { font-size: 11px; }
            .history-table th, .history-table td { padding: 4px 6px; }
        }
    </style>
</head>
<body>

<div class="glass-container">
    <div class="header">
        <h1>📡 PC28未来数据站</h1>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusLabel">实时</span>
            <span class="time-label" id="updateTime">--</span>
        </div>
    </div>

    <div class="toolbar">
        <div class="info">
            数据源 <span id="sourceIndicator">pc28.help</span>
            <span class="error-msg" id="errorMsg">⚠️ 加载失败</span>
            <span class="push-msg" id="pushMsg">✅ 推送成功</span>
        </div>
        <div class="btns">
            <button class="push-btn" id="pushBtn" title="推送到Telegram">📤 推送</button>
            <button class="primary" id="refreshBtn">🔄 刷新</button>
            <button id="toggleBtn">⏸️ 暂停</button>
        </div>
    </div>

    <div class="countdown-card">
        <div class="label"><span class="icon">⏳</span>下一期倒计时</div>
        <div class="time" id="countdownDisplay">--:--</div>
        <div class="next-period" id="nextPeriodLabel">—</div>
    </div>

    <div class="balls-row" id="ballsDisplay">
        <div class="ball-item">
            <div class="num" id="displayBall1">-</div>
            <span class="label">第1球</span>
        </div>
        <span class="op">+</span>
        <div class="ball-item">
            <div class="num" id="displayBall2">-</div>
            <span class="label">第2球</span>
        </div>
        <span class="op">+</span>
        <div class="ball-item">
            <div class="num" id="displayBall3">-</div>
            <span class="label">第3球</span>
        </div>
        <span class="eq">=</span>
        <div class="ball-item">
            <div class="num special" id="displaySpecial">-</div>
            <span class="label">总和</span>
        </div>
    </div>

    <div class="combo-tag" id="combinationTag">—</div>

    <div class="terms-row" id="termsRow">
        <div class="item">单/双 <span id="termOddEven">-</span></div>
        <div class="item">大/小 <span id="termBigSmall">-</span></div>
        <div class="item">组合 <span id="termCombination">-</span></div>
        <div class="item">形态 <span id="termShape">-</span></div>
    </div>

    <div class="history-section">
        <div class="title">📊 最近开奖</div>
        <table class="history-table">
            <thead>
                <tr>
                    <th class="col-period">期号</th>
                    <th class="col-result">开奖</th>
                    <th class="col-sum">和值</th>
                    <th class="col-combo">组合</th>
                    <th class="col-shape">形态</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.06);padding:20px 0;">暂无数据</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <code>window.PC28_DATA</code> 对外接口 · 每20秒自动更新
    </div>
</div>

<!-- Canvas 用于生成图片（隐藏） -->
<canvas id="cardCanvas" width="800" height="420" style="display:none;"></canvas>

<script>
    (function() {
        'use strict';

        // ============================================================
        // Telegram 配置
        // ============================================================
        const TG_CONFIG = {
            botToken: '8415517129:AAGWygn6B9lgvvktbGed1nV-9aebZFIFLwo',
            channelId: '@pc28jndkj',
            groupId: '-1003480986680',
            enabled: true,
        };

        // ============================================================
        // 配置
        // ============================================================
        const REFRESH_INTERVAL = 20000;    // 20秒（配合快速推送）
        const ROUND_INTERVAL = 210;        // 3.5分钟
        const MAX_HISTORY = 50;

        // ============================================================
        // DOM 引用
        // ============================================================
        const displayBall1 = document.getElementById('displayBall1');
        const displayBall2 = document.getElementById('displayBall2');
        const displayBall3 = document.getElementById('displayBall3');
        const displaySpecial = document.getElementById('displaySpecial');
        const combinationTag = document.getElementById('combinationTag');
        const updateTimeEl = document.getElementById('updateTime');
        const sourceIndicator = document.getElementById('sourceIndicator');
        const errorMsgEl = document.getElementById('errorMsg');
        const pushMsgEl = document.getElementById('pushMsg');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const toggleBtn = document.getElementById('toggleBtn');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const nextPeriodLabel = document.getElementById('nextPeriodLabel');
        const historyBody = document.getElementById('historyBody');
        const cardCanvas = document.getElementById('cardCanvas');

        // ============================================================
        // 工具函数
        // ============================================================
        function analyzeTerms(b1, b2, b3, sum_val) {
            const oddEven = sum_val % 2 === 0 ? '双' : '单';
            const bigSmall = sum_val <= 13 ? '小' : '大';
            let combination = '';
            if (sum_val <= 13 && sum_val % 2 === 0) combination = '小双';
            else if (sum_val <= 13 && sum_val % 2 === 1) combination = '小单';
            else if (sum_val > 13 && sum_val % 2 === 0) combination = '大双';
            else if (sum_val > 13 && sum_val % 2 === 1) combination = '大单';

            const sorted = [b1, b2, b3].slice().sort((a, b) => a - b);
            const isConsecutive = (sorted[2] - sorted[1] === 1 && sorted[1] - sorted[0] === 1);
            let straight = '否';
            if (isConsecutive && sorted[0] >= 1 && sorted[2] <= 9) straight = '是';
            const pair = (b1 === b2 || b2 === b3 || b1 === b3) ? '是' : '否';
            const triple = (b1 === b2 && b2 === b3) ? '是' : '否';
            let shape = '杂六';
            if (triple === '是') shape = '豹子';
            else if (pair === '是') shape = '对子';
            else if (straight === '是') shape = '顺子';
            return { oddEven, bigSmall, combination, shape, straight, pair, triple };
        }

        function parseFromNumber(numberStr) {
            if (!numberStr) return null;
            const parts = numberStr.split('+');
            if (parts.length === 3) {
                return [parseInt(parts[0].trim()), parseInt(parts[1].trim()), parseInt(parts[2].trim())];
            }
            return null;
        }

        function calculateFromNbrs(nbrsStr) {
            if (!nbrsStr) return null;
            const nums = nbrsStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            if (nums.length !== 20) return null;
            const idx1 = [1, 4, 7, 10, 13, 16];
            const idx2 = [2, 5, 8, 11, 14, 17];
            const idx3 = [3, 6, 9, 12, 15, 18];
            const b1 = idx1.reduce((s, i) => s + nums[i], 0) % 10;
            const b2 = idx2.reduce((s, i) => s + nums[i], 0) % 10;
            const b3 = idx3.reduce((s, i) => s + nums[i], 0) % 10;
            return [b1, b2, b3];
        }

        // ============================================================
        // 获取最新数据
        // ============================================================
        async function fetchData() {
            const t = Date.now();   // cache-busting：绕过 GitHub Pages 缓存，拿到最新数据
            const candidates = ['data_pc28.json', 'data_yu28.json'];
            for (const file of candidates) {
                try {
                    const resp = await fetch(`${file}?t=${t}`);
                    if (!resp.ok) continue;
                    const json = await resp.json();
                    if (json && Array.isArray(json.data) && json.data.length > 0) {
                        return json;
                    }
                } catch (e) {
                    console.warn(`数据源 ${file} 解析失败，尝试下一个:`, e);
                }
            }
            throw new Error('无法获取数据');
        }

        // ============================================================
        // 历史记录
        // ============================================================
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('pc28_history') || '[]'); } catch { return []; }
        }
        function saveHistory(entry) {
            let h = getHistory().filter(x => x.period !== entry.period);
            h.unshift(entry);
            if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
            localStorage.setItem('pc28_history', JSON.stringify(h));
        }
        function renderHistory(history) {
            historyBody.innerHTML = '';
            if (!history.length) {
                historyBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.06);padding:20px 0;">暂无数据</td></tr>';
                return;
            }
            history.slice(0, 15).forEach((h, i) => {
                const tr = document.createElement('tr');
                if (i === 0) tr.className = 'latest';
                tr.innerHTML = `
                    <td class="col-period">${h.period}</td>
                    <td class="col-result">${h.ball1}+${h.ball2}+${h.ball3}</td>
                    <td class="col-sum">${h.sum}</td>
                    <td class="col-combo">${h.combination || '-'}</td>
                    <td class="col-shape">${h.shape || '-'}</td>
                `;
                historyBody.appendChild(tr);
            });
        }

        // ============================================================
        // 倒计时
        // ============================================================
        let lastOpenTime = null;
        let currentPeriod = '';
        let lastZeroFetch = 0;
        function updateCountdown() {
            if (!lastOpenTime) {
                countdownDisplay.textContent = '--:--';
                return;
            }
            const now = Date.now();
            const elapsed = (now - lastOpenTime) / 1000;
            const rounds = Math.floor(elapsed / ROUND_INTERVAL);
            const nextTime = new Date(lastOpenTime + (rounds + 1) * ROUND_INTERVAL * 1000);
            const remaining = (nextTime - now) / 1000;
            if (remaining < 0) {
                countdownDisplay.textContent = '00:00';
                return;
            }
            // 归零瞬间自动拉一次新数据（防抖，避免与轮询重复）
            if (remaining <= 1 && now - lastZeroFetch > 5000) {
                lastZeroFetch = now;
                fetchAndRender();
            }
            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60);
            countdownDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            countdownDisplay.classList.toggle('warning', remaining < 30);
        }
        setInterval(updateCountdown, 500);

        // ============================================================
        // Canvas 生成开奖卡片图片
        // ============================================================
        function generateCardImage(period, b1, b2, b3, sum, combination, shape, date, time) {
            const ctx = cardCanvas.getContext('2d');
            const w = 800, h = 420;
            cardCanvas.width = w;
            cardCanvas.height = h;

            // 背景渐变
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#0f1f2f');
            grad.addColorStop(0.7, '#1a2a4a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 边框
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 2;
            ctx.strokeRect(10, 10, w - 20, h - 20);

            // 标题
            ctx.textAlign = 'left';
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.font = '16px "Segoe UI", sans-serif';
            ctx.fillText('PC28 开奖结果', 30, 50);

            // 期号
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('第 ' + period + ' 期', w - 30, 50);

            // 三个球
            const circleY = 155;
            const radius = 50;
            const spacing = 130;
            const startX = (w - 2 * spacing) / 2 - 10;
            const balls = [b1, b2, b3];

            balls.forEach((num, i) => {
                const x = startX + i * spacing;
                // 球的渐变
                const gradCirc = ctx.createRadialGradient(x - 15, circleY - 15, 10, x, circleY, radius);
                gradCirc.addColorStop(0, '#6ad4ff');
                gradCirc.addColorStop(1, '#1a7ab5');
                ctx.beginPath();
                ctx.arc(x, circleY, radius, 0, Math.PI * 2);
                ctx.fillStyle = gradCirc;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();
                // 数字
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 44px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(num, x, circleY + 2);
                // 加号
                if (i < 2) {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '28px "Segoe UI", sans-serif';
                    ctx.fillText('+', x + spacing / 2, circleY);
                }
            });

            // 和值
            ctx.fillStyle = '#ffd54f';
            ctx.font = 'bold 32px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('= ' + sum, w / 2, circleY + radius + 25);

            // 组合
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px "Segoe UI", sans-serif';
            ctx.fillText(combination, w / 2, circleY + radius + 65);

            // 形态
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.fillText('形态：' + shape, w / 2, circleY + radius + 95);

            // 时间
            const dateStr = (date && time) ? '开奖时间 ' + date + ' ' + time : '';
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '12px "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateStr, w - 30, h - 20);

            // 转成 blob
            return new Promise((resolve) => {
                cardCanvas.toBlob(resolve, 'image/png');
            });
        }

        // ============================================================
        // Telegram 推送
        // ============================================================
        async function sendPhotoToChannel(chatId, photoBlob, caption) {
            if (!TG_CONFIG.enabled || !TG_CONFIG.botToken) return false;
            const url = 'https://api.telegram.org/bot' + TG_CONFIG.botToken + '/sendPhoto';
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('photo', photoBlob, 'result.png');
            if (caption) fd.append('caption', caption);
            fd.append('parse_mode', 'HTML');
            try {
                const r = await fetch(url, { method: 'POST', body: fd });
                const j = await r.json();
                if (j.ok) { console.log('✅ 频道图片发送成功'); return true; }
                console.error('❌ 频道图片发送失败:', j);
                return false;
            } catch (e) {
                console.error('❌ 频道图片发送异常:', e);
                return false;
            }
        }

        async function sendTextToGroup(chatId, text) {
            if (!TG_CONFIG.enabled || !TG_CONFIG.botToken) return false;
            const url = 'https://api.telegram.org/bot' + TG_CONFIG.botToken + '/sendMessage';
            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'HTML',
                        disable_web_page_preview: true
                    })
                });
                const j = await r.json();
                if (j.ok) { console.log('✅ 群组文字发送成功'); return true; }
                console.error('❌ 群组文字发送失败:', j);
                return false;
            } catch (e) {
                console.error('❌ 群组文字发送异常:', e);
                return false;
            }
        }

        function buildPushMessage(period, b1, b2, b3, sum, terms, date, time) {
            const dateStr = (date && time) ? date + ' ' + time : '未知时间';
            return '📢 最新开奖信息\n' +
                   '📅 最新期号: ' + period + '\n' +
                   '🔢 开奖结果: ' + b1 + '+' + b2 + '+' + b3 + '=' + sum + ' ' + terms.combination + '\n' +
                   '🎉 号码形式: ' + terms.shape + '|中\n' +
                   '⏰ 开奖时间: ' + dateStr;
        }

        // 主动推送当前数据
        async function pushToTelegram() {
            if (!window.PC28_DATA) {
                showError('暂无数据可推送，请先等待数据加载');
                return;
            }
            const d = window.PC28_DATA;
            showPushStatus('推送中...', false);

            // 1. 生成图片
            const blob = await generateCardImage(
                d.period, d.b1, d.b2, d.b3, d.sum,
                d.terms.combination, d.terms.shape, d.date, d.time
            );

            // 2. 发送频道图片
            const caption = '第' + d.period + '期 ' + d.b1 + '+' + d.b2 + '+' + d.b3 + '=' + d.sum + ' ' + d.terms.combination;
            let ok1 = false, ok2 = false;
            if (TG_CONFIG.channelId) {
                ok1 = await sendPhotoToChannel(TG_CONFIG.channelId, blob, caption);
            }

            // 3. 发送群组文字
            const text = buildPushMessage(d.period, d.b1, d.b2, d.b3, d.sum, d.terms, d.date, d.time);
            if (TG_CONFIG.groupId) {
                ok2 = await sendTextToGroup(TG_CONFIG.groupId, text);
            }

            if (ok1 || ok2) {
                showPushStatus('✅ 推送成功', true);
            } else {
                showError('推送失败，请检查控制台');
            }
        }

        function showPushStatus(msg, ok) {
            pushMsgEl.textContent = msg;
            pushMsgEl.style.display = 'inline-block';
            pushMsgEl.style.color = ok ? '#6bff9e' : '#ffd54f';
            errorMsgEl.style.display = 'none';
            if (ok) {
                setTimeout(() => { pushMsgEl.style.display = 'none'; }, 3000);
            }
        }

        function showError(msg) {
            errorMsgEl.textContent = '⚠️ ' + msg;
            errorMsgEl.style.display = 'inline-block';
            pushMsgEl.style.display = 'none';
        }

        // ============================================================
        // 对外接口
        // ============================================================
        window.PC28_DATA = null;
        window.pushPC28ToTelegram = pushToTelegram; // 外部可调用

        // ============================================================
        // 主渲染
        // ============================================================
        async function fetchAndRender() {
            errorMsgEl.style.display = 'none';
            try {
                const json = await fetchData();
                const item = json.data[0];

                const period = item.nbr || '未知期号';
                const date = item.date || '';
                const time = item.time || '';
                const nbrs = item.nbrs || '';
                const number = item.number || '';
                const combination = item.combination || '';

                let balls = null;
                let sourceName = '';

                if (nbrs) {
                    balls = calculateFromNbrs(nbrs);
                    if (balls) sourceName = 'Keno原始数据(按规则计算)';
                }
                if (!balls && number) {
                    balls = parseFromNumber(number);
                    if (balls) sourceName = 'PC28数据(直接解析)';
                }
                if (!balls) throw new Error('无法解析号码');

                const [b1, b2, b3] = balls;
                const sum_val = b1 + b2 + b3;
                const special = sum_val % 10;
                const terms = analyzeTerms(b1, b2, b3, sum_val);
                if (combination) terms.combination = combination;

                const dataObj = {
                    period, b1, b2, b3, special, sum: sum_val,
                    terms, date, time, sourceName
                };
                window.PC28_DATA = dataObj;
                currentPeriod = period;

                // 下一期期号（当前期号 +1，遇 9999999 归 1）
                let nextPeriod = '';
                if (period && /^\d+$/.test(String(period))) {
                    const pn = parseInt(period, 10) + 1;
                    nextPeriod = String(pn).padStart(String(period).length, '0');
                }
                nextPeriodLabel.textContent = nextPeriod ? '下一期 ' + nextPeriod : '—';

                // 更新界面
                displayBall1.textContent = b1;
                displayBall2.textContent = b2;
                displayBall3.textContent = b3;
                displaySpecial.textContent = sum_val;
                combinationTag.innerHTML = '<strong>' + terms.combination + '</strong> · ' + terms.shape;

                document.getElementById('termOddEven').textContent = terms.oddEven;
                document.getElementById('termBigSmall').textContent = terms.bigSmall;
                document.getElementById('termCombination').textContent = terms.combination;
                document.getElementById('termShape').textContent = terms.shape;

                const now = new Date();
                updateTimeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
                sourceIndicator.textContent = sourceName || 'pc28.help';

                // 倒计时
                if (date && time) {
                    const ot = new Date(date + ' ' + time);
                    if (!isNaN(ot)) {
                        lastOpenTime = ot.getTime();
                        updateCountdown();
                    }
                }

                // 历史
                saveHistory({
                    period,
                    ball1: b1, ball2: b2, ball3: b3,
                    sum: sum_val,
                    combination: terms.combination,
                    shape: terms.shape
                });
                renderHistory(getHistory());

                console.log('[PC28] 更新:', period, b1, b2, b3, '=', sum_val);

            } catch (err) {
                console.error('[PC28] 加载失败:', err);
                showError(err.message);
            }
        }

        // ============================================================
        // 自动刷新
        // ============================================================
        let timer = null;
        let isRunning = true;

        function startAuto() {
            if (timer) clearInterval(timer);
            timer = setInterval(fetchAndRender, REFRESH_INTERVAL);
            isRunning = true;
            statusDot.className = 'dot';
            statusLabel.textContent = '实时';
            toggleBtn.textContent = '⏸️ 暂停';
        }

        function stopAuto() {
            if (timer) { clearInterval(timer); timer = null; }
            isRunning = false;
            statusDot.className = 'dot paused';
            statusLabel.textContent = '暂停';
            toggleBtn.textContent = '▶️ 继续';
        }

        function toggleAuto() {
            if (isRunning) stopAuto();
            else { startAuto(); fetchAndRender(); }
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', fetchAndRender);
        document.getElementById('toggleBtn').addEventListener('click', toggleAuto);
        document.getElementById('pushBtn').addEventListener('click', pushToTelegram);

        // 启动
        fetchAndRender().then(startAuto).catch(startAuto);
        window.addEventListener('beforeunload', () => { if (timer) clearInterval(timer); });

        console.log('[PC28] 未来数据站已启动，Telegram推送已就绪');
        console.log(' 频道ID:', TG_CONFIG.channelId);
        console.log(' 群组ID:', TG_CONFIG.groupId);
        console.log(' 手动推送: 点击📤按钮 或调用 window.pushPC28ToTelegram()');
    })();
</script>
</body>
