<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC28未来数据站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 30%, #0d1a2b, #060b14);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #eef4fc;
        }

        .glass-container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 100px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04), 0 0 60px rgba(80,160,255,0.02);
            padding: 28px 32px 36px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        .glass-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(80,180,255,0.04), transparent, rgba(200,130,255,0.04), transparent);
            animation: rotateGlow 35s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .glass-container > * { position: relative; z-index: 1; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #7ec8ff, #b494ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
        }
        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cdb7b;
            display: inline-block;
            animation: pulse-dot 1.5s infinite;
            box-shadow: 0 0 12px rgba(76,219,123,0.2);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .header .status .dot.paused { background: #f5a623; animation: none; box-shadow: 0 0 12px rgba(245,166,35,0.15); }
        .header .status .time-label { color: rgba(255,255,255,0.2); margin-left: 4px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .toolbar .info {
            font-size: 13px;
            color: rgba(255,255,255,0.2);
        }
        .toolbar .info span { color: rgba(255,255,255,0.5); }
        .toolbar .btns { display: flex; gap: 6px; }
        .toolbar .btns button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            backdrop-filter: blur(4px);
        }
        .toolbar .btns button:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.1);
        }
        .toolbar .btns .primary {
            background: rgba(100,200,255,0.06);
            border-color: rgba(100,200,255,0.08);
            color: rgba(100,200,255,0.6);
        }
        .toolbar .btns .primary:hover {
            background: rgba(100,200,255,0.12);
            color: rgba(100,200,255,0.8);
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            display: none;
            margin-left: 10px;
        }

        .countdown-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 20px 30px;
            margin: 10px 0 22px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .countdown-card .label {
            font-size: 15px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .countdown-card .label .icon { font-size: 22px; }
        .countdown-card .time {
            font-size: 44px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8fcbff, #b494ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-width: 140px;
            text-align: right;
        }
        .countdown-card .time.warning {
            background: linear-gradient(135deg, #ffb07a, #ff7a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 22px 0 14px;
            flex-wrap: wrap;
        }
        .balls-row .ball-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .balls-row .ball-item .num {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 0 30px rgba(255,255,255,0.02);
            color: #eef4fc;
            transition: 0.3s;
        }
        .balls-row .ball-item .num.special {
            border-color: rgba(255,200,100,0.12);
            background: rgba(255,200,100,0.03);
            color: #ffd54f;
            box-shadow: 0 0 40px rgba(255,200,100,0.04);
        }
        .balls-row .ball-item .label {
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
        }
        .balls-row .op {
            font-size: 24px;
            color: rgba(255,255,255,0.05);
            font-weight: 300;
        }
        .balls-row .eq {
            font-size: 24px;
            color: rgba(255,255,255,0.06);
            font-weight: 300;
        }
        .balls-row .sum {
            font-size: 30px;
            font-weight: 700;
            color: #ffd54f;
            min-width: 44px;
            text-align: center;
            text-shadow: 0 0 30px rgba(255,213,79,0.05);
        }

        .combo-tag {
            text-align: center;
            padding: 6px 0 18px;
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
        }
        .combo-tag strong {
            background: linear-gradient(135deg, #ffd54f, #ffb07a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .terms-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 28px;
            padding: 14px 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            margin-bottom: 20px;
        }
        .terms-row .item {
            font-size: 13px;
            color: rgba(255,255,255,0.2);
        }
        .terms-row .item span {
            color: rgba(255,255,255,0.7);
            font-weight: 500;
            margin-left: 6px;
        }

        .history-section {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
            margin-top: 4px;
        }
        .history-section .title {
            padding: 14px 20px 10px;
            font-size: 13px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .history-table th {
            text-align: left;
            padding: 8px 16px;
            color: rgba(255,255,255,0.12);
            font-weight: 400;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .history-table td {
            padding: 7px 16px;
            color: rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.01);
            font-size: 13px;
        }
        .history-table tr:last-child td { border-bottom: none; }
        .history-table .latest td {
            color: rgba(255,255,255,0.8);
        }
        .history-table .latest .highlight {
            color: #ffd54f;
        }
        .history-table .col-period { width: 20%; }
        .history-table .col-result { width: 26%; }
        .history-table .col-sum { width: 16%; }
        .history-table .col-combo { width: 20%; }
        .history-table .col-shape { width: 18%; }

        .footer {
            text-align: center;
            padding: 20px 0 4px;
            font-size: 11px;
            color: rgba(255,255,255,0.06);
            letter-spacing: 0.5px;
        }
        .footer code {
            background: rgba(255,255,255,0.03);
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 10px;
            color: rgba(255,255,255,0.08);
        }

        @media (max-width: 640px) {
            .glass-container { padding: 18px 16px 24px; border-radius: 28px; }
            .countdown-card .time { font-size: 32px; min-width: 100px; }
            .countdown-card { padding: 16px 20px; }
            .balls-row .ball-item .num { width: 58px; height: 58px; font-size: 26px; }
            .balls-row { gap: 10px; }
            .history-table { font-size: 12px; }
            .history-table th, .history-table td { padding: 5px 10px; }
            .header h1 { font-size: 20px; }
            .terms-row { gap: 6px 16px; padding: 10px 14px; }
            .terms-row .item { font-size: 12px; }
        }
        @media (max-width: 420px) {
            .countdown-card { flex-direction: column; align-items: stretch; text-align: center; }
            .countdown-card .time { text-align: center; font-size: 28px; }
            .balls-row .ball-item .num { width: 48px; height: 48px; font-size: 20px; }
            .balls-row { gap: 6px; }
            .balls-row .op, .balls-row .eq { font-size: 16px; }
            .history-table { font-size: 11px; }
            .history-table th, .history-table td { padding: 4px 6px; }
        }
    </style>
</head>
<body>

<div class="glass-container">
    <div class="header">
        <h1>📡 PC28未来数据站</h1>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusLabel">实时</span>
            <span class="time-label" id="updateTime">--</span>
        </div>
    </div>

    <div class="toolbar">
        <div class="info">
            数据源 <span id="sourceIndicator">pc28.help</span>
            <span class="error-msg" id="errorMsg">⚠️ 加载失败</span>
        </div>
        <div class="btns">
            <button class="primary" id="refreshBtn">🔄 刷新</button>
            <button id="toggleBtn">⏸️ 暂停</button>
        </div>
    </div>

    <div class="countdown-card">
        <div class="label"><span class="icon">⏳</span>下一期倒计时</div>
        <div class="time" id="countdownDisplay">--:--</div>
    </div>

    <div class="balls-row" id="ballsDisplay">
        <div class="ball-item">
            <div class="num" id="displayBall1">-</div>
            <span class="label">第1球</span>
        </div>
        <span class="op">+</span>
        <div class="ball-item">
            <div class="num" id="displayBall2">-</div>
            <span class="label">第2球</span>
        </div>
        <span class="op">+</span>
        <div class="ball-item">
            <div class="num" id="displayBall3">-</div>
            <span class="label">第3球</span>
        </div>
        <span class="eq">=</span>
        <div class="ball-item">
            <div class="num special" id="displaySpecial">-</div>
            <span class="label" style="color:rgba(255,200,100,0.15);">特码</span>
        </div>
    </div>

    <div class="combo-tag" id="combinationTag">—</div>

    <div class="terms-row" id="termsRow">
        <div class="item">单/双 <span id="termOddEven">-</span></div>
        <div class="item">大/小 <span id="termBigSmall">-</span></div>
        <div class="item">组合 <span id="termCombination">-</span></div>
        <div class="item">形态 <span id="termShape">-</span></div>
    </div>

    <div class="history-section">
        <div class="title">📊 最近开奖</div>
        <table class="history-table">
            <thead>
                <tr>
                    <th class="col-period">期号</th>
                    <th class="col-result">开奖</th>
                    <th class="col-sum">和值</th>
                    <th class="col-combo">组合</th>
                    <th class="col-shape">形态</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.06);padding:20px 0;">暂无数据</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <code>window.PC28_DATA</code> 对外接口 · 每3分钟自动更新
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // 配置
        // ============================================================
        const REFRESH_INTERVAL = 180000;   // 3分钟
        const ROUND_INTERVAL = 210;        // 3.5分钟
        const MAX_HISTORY = 50;

        // ============================================================
        // DOM 引用
        // ============================================================
        const displayBall1 = document.getElementById('displayBall1');
        const displayBall2 = document.getElementById('displayBall2');
        const displayBall3 = document.getElementById('displayBall3');
        const displaySpecial = document.getElementById('displaySpecial');
        const combinationTag = document.getElementById('combinationTag');
        const updateTimeEl = document.getElementById('updateTime');
        const sourceIndicator = document.getElementById('sourceIndicator');
        const errorMsgEl = document.getElementById('errorMsg');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const toggleBtn = document.getElementById('toggleBtn');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const historyBody = document.getElementById('historyBody');

        // ============================================================
        // 工具函数
        // ============================================================
        function analyzeTerms(b1, b2, b3, special) {
            const oddEven = special % 2 === 0 ? '双' : '单';
            const bigSmall = special <= 13 ? '小' : '大';
            let combination = '';
            if (special <= 13 && special % 2 === 0) combination = '小双';
            else if (special <= 13 && special % 2 === 1) combination = '小单';
            else if (special > 13 && special % 2 === 0) combination = '大双';
            else if (special > 13 && special % 2 === 1) combination = '大单';
            const sorted = [b1,b2,b3].slice().sort((a,b)=>a-b);
            const isConsecutive = (sorted[2]-sorted[1]===1 && sorted[1]-sorted[0]===1);
            let straight = '否';
            if (isConsecutive && sorted[0]>=1 && sorted[2]<=9) straight = '是';
            const pair = (b1===b2 || b2===b3 || b1===b3) ? '是' : '否';
            const triple = (b1===b2 && b2===b3) ? '是' : '否';
            let shape = '杂六';
            if (triple === '是') shape = '豹子';
            else if (pair === '是') shape = '对子';
            else if (straight === '是') shape = '顺子';
            return { oddEven, bigSmall, combination, shape };
        }

        function parseFromNumber(numberStr) {
            if (!numberStr) return null;
            const parts = numberStr.split('+');
            if (parts.length === 3) {
                return [parseInt(parts[0].trim()), parseInt(parts[1].trim()), parseInt(parts[2].trim())];
            }
            return null;
        }

        function calculateFromNbrs(nbrsStr) {
            if (!nbrsStr) return null;
            const nums = nbrsStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            if (nums.length !== 20) return null;
            const idx1 = [1, 4, 7, 10, 13, 16];
            const idx2 = [2, 5, 8, 11, 14, 17];
            const idx3 = [3, 6, 9, 12, 15, 18];
            const b1 = idx1.reduce((s, i) => s + nums[i], 0) % 10;
            const b2 = idx2.reduce((s, i) => s + nums[i], 0) % 10;
            const b3 = idx3.reduce((s, i) => s + nums[i], 0) % 10;
            return [b1, b2, b3];
        }

        // ============================================================
        // 获取最新数据（优先读取 data_pc28.json）
        // ============================================================
        async function fetchData() {
            try {
                // 优先读 pc28.help 的数据
                let resp = await fetch('data_pc28.json');
                if (!resp.ok) {
                    resp = await fetch('data_yu28.json');
                }
                if (!resp.ok) {
                    resp = await fetch('data.json');
                }
                if (!resp.ok) {
                    throw new Error('无法获取数据');
                }
                const json = await resp.json();
                if (!json.data || json.data.length === 0) {
                    throw new Error('数据为空');
                }
                return json;
            } catch (err) {
                console.error('获取数据失败:', err);
                throw err;
            }
        }

        // ============================================================
        // 历史记录
        // ============================================================
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('pc28_history') || '[]'); } catch { return []; }
        }
        function saveHistory(entry) {
            let h = getHistory().filter(x => x.period !== entry.period);
            h.unshift(entry);
            if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
            localStorage.setItem('pc28_history', JSON.stringify(h));
        }
        function renderHistory(history) {
            historyBody.innerHTML = '';
            if (!history.length) {
                historyBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.06);padding:20px 0;">暂无数据</td></tr>';
                return;
            }
            history.slice(0, 15).forEach((h, i) => {
                const tr = document.createElement('tr');
                if (i === 0) tr.className = 'latest';
                tr.innerHTML = `
                    <td class="col-period">${h.period}</td>
                    <td class="col-result">${h.ball1}+${h.ball2}+${h.ball3}</td>
                    <td class="col-sum">${h.sum}</td>
                    <td class="col-combo">${h.combination || '-'}</td>
                    <td class="col-shape">${h.shape || '-'}</td>
                `;
                historyBody.appendChild(tr);
            });
        }

        // ============================================================
        // 倒计时
        // ============================================================
        let lastOpenTime = null;
        function updateCountdown() {
            if (!lastOpenTime) {
                countdownDisplay.textContent = '--:--';
                return;
            }
            const now = Date.now();
            const elapsed = (now - lastOpenTime) / 1000;
            const rounds = Math.floor(elapsed / ROUND_INTERVAL);
            const nextTime = new Date(lastOpenTime + (rounds + 1) * ROUND_INTERVAL * 1000);
            const remaining = (nextTime - now) / 1000;
            if (remaining < 0) {
                countdownDisplay.textContent = '00:00';
                return;
            }
            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60);
            countdownDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            countdownDisplay.classList.toggle('warning', remaining < 30);
        }
        setInterval(updateCountdown, 500);

        // ============================================================
        // 对外接口
        // ============================================================
        window.PC28_DATA = null;

        // ============================================================
        // 主渲染
        // ============================================================
        async function fetchAndRender() {
            errorMsgEl.style.display = 'none';
            try {
                const json = await fetchData();
                const item = json.data[0];

                const period = item.nbr || '未知期号';
                const date = item.date || '';
                const time = item.time || '';
                const nbrs = item.nbrs || '';
                const number = item.number || '';
                const combination = item.combination || '';

                let balls = null;
                let sourceName = '';

                // 优先用 nbrs 按规则计算
                if (nbrs) {
                    balls = calculateFromNbrs(nbrs);
                    if (balls) {
                        sourceName = 'Keno原始数据(按规则计算)';
                    }
                }

                // 如果没有 nbrs，用 number
                if (!balls && number) {
                    balls = parseFromNumber(number);
                    if (balls) {
                        sourceName = 'PC28数据(直接解析)';
                    }
                }

                if (!balls) {
                    throw new Error('无法解析号码');
                }

                const [b1, b2, b3] = balls;
                const sum_val = b1 + b2 + b3;
                const special = sum_val % 10;
                const terms = analyzeTerms(b1, b2, b3, special);

                // 如果接口提供了 combination，优先使用
                if (combination) {
                    terms.combination = combination;
                }

                const dataObj = {
                    period, b1, b2, b3, special, sum: sum_val,
                    terms, date, time, sourceName
                };
                window.PC28_DATA = dataObj;

                // 更新界面
                displayBall1.textContent = b1;
                displayBall2.textContent = b2;
                displayBall3.textContent = b3;
                displaySpecial.textContent = special;
                combinationTag.innerHTML = `<strong>${terms.combination}</strong> · ${terms.shape}`;

                document.getElementById('termOddEven').textContent = terms.oddEven;
                document.getElementById('termBigSmall').textContent = terms.bigSmall;
                document.getElementById('termCombination').textContent = terms.combination;
                document.getElementById('termShape').textContent = terms.shape;

                const now = new Date();
                updateTimeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
                sourceIndicator.textContent = sourceName || 'pc28.help';

                // 倒计时
                if (date && time) {
                    const ot = new Date(`${date} ${time}`);
                    if (!isNaN(ot)) {
                        lastOpenTime = ot.getTime();
                        updateCountdown();
                    }
                }

                // 历史
                const entry = {
                    period,
                    ball1: b1, ball2: b2, ball3: b3,
                    sum: sum_val,
                    combination: terms.combination,
                    shape: terms.shape
                };
                saveHistory(entry);
                renderHistory(getHistory());

                console.log('[PC28] 更新:', period, b1, b2, b3, '=', sum_val);

            } catch (err) {
                console.error('[PC28] 加载失败:', err);
                errorMsgEl.style.display = 'inline-block';
                errorMsgEl.textContent = '⚠️ ' + err.message;
            }
        }

        // ============================================================
        // 自动刷新
        // ============================================================
        let timer = null;
        let isRunning = true;

        function startAuto() {
            if (timer) clearInterval(timer);
            timer = setInterval(fetchAndRender, REFRESH_INTERVAL);
            isRunning = true;
            statusDot.className = 'dot';
            statusLabel.textContent = '实时';
            toggleBtn.textContent = '⏸️ 暂停';
        }

        function stopAuto() {
            if (timer) { clearInterval(timer); timer = null; }
            isRunning = false;
            statusDot.className = 'dot paused';
            statusLabel.textContent = '暂停';
            toggleBtn.textContent = '▶️ 继续';
        }

        function toggleAuto() {
            if (isRunning) stopAuto();
            else { startAuto(); fetchAndRender(); }
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchAndRender);
        toggleBtn.addEventListener('click', toggleAuto);

        fetchAndRender().then(startAuto).catch(startAuto);
        window.addEventListener('beforeunload', () => { if (timer) clearInterval(timer); });

        console.log('[PC28] 未来数据站已启动');
    })();
</script>
</body>
</html>
