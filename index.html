<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC28未来数据站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 30%, #0d1a2b, #060b14);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #eef4fc;
        }

        .glass-container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 100px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04), 0 0 60px rgba(80,160,255,0.02);
            padding: 28px 32px 36px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        .glass-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(80,180,255,0.04), transparent, rgba(200,130,255,0.04), transparent);
            animation: rotateGlow 35s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .glass-container > * { position: relative; z-index: 1; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #7ec8ff, #b494ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
        }
        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cdb7b;
            display: inline-block;
            animation: pulse-dot 1.5s infinite;
            box-shadow: 0 0 12px rgba(76,219,123,0.2);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .header .status .dot.paused { background: #f5a623; animation: none; box-shadow: 0 0 12px rgba(245,166,35,0.15); }
        .header .status .time-label { color: rgba(255,255,255,0.2); margin-left: 4px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .toolbar .info {
            font-size: 13px;
            color: rgba(255,255,255,0.2);
        }
        .toolbar .info span { color: rgba(255,255,255,0.5); }
        .toolbar .btns { display: flex; gap: 6px; }
        .toolbar .btns button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            backdrop-filter: blur(4px);
        }
        .toolbar .btns button:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.1);
        }
        .toolbar .btns .primary {
            background: rgba(100,200,255,0.06);
            border-color: rgba(100,200,255,0.08);
            color: rgba(100,200,255,0.6);
        }
        .toolbar .btns .primary:hover {
            background: rgba(100,200,255,0.12);
            color: rgba(100,200,255,0.8);
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            display: none;
            margin-left: 10px;
        }

        .countdown-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 20px 30px;
            margin: 10px 0 22px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .countdown-card .label {
            font-size: 15px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .countdown-card .label .icon { font-size: 22px; }
        .countdown-card .time {
            font-size: 44px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8fcbff, #b494ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-width: 140px;
            text-align: right;
        }
        .countdown-card .time.warning {
            background: linear-gradient(135deg, #ffb07a, #ff7a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 22px 0 14px;
            flex-wrap: wrap;
        }
        .balls-row .ball-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .balls-row .ball-item .num {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 0 30px rgba(255,255,255,0.02);
            color: #eef4fc;
            transition: 0.3s;
        }
        .balls-row .ball-item .num.special {
            border-color: rgba(255,200,100,0.12);
            background: rgba(255,200,100,0.03);
            color: #ffd54f;
            box-shadow: 0 0 40px rgba(255,200,100,0.04);
        }
        .balls-row .ball-item .label {
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
        }
        .balls-row .op {
            font-size: 24px;
            color: rgba(255,255,255,0.05);
            font-weight: 300;
        }
        .balls-row .eq {
            font-size: 24px;
            color: rgba(255,255,255,0.06);
            font-weight: 300;
        }
        .balls-row .sum {
            font-size: 30px;
            font-weight: 700;
            color: #ffd54f;
            min-width: 44px;
            text-align: center;
            text-shadow: 0 0 30px rgba(255,213,79,0.05);
        }

        .combo-tag {
            text-align: center;
            padding: 6px 0 18px;
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
        }
        .combo-tag strong {
            background: linear-gradient(135deg, #ffd54f, #ffb07a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .terms-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 28px;
            padding: 14px 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            margin-bottom: 20px;
        }
        .terms-row .item {
            font-size: 13px;
            color: rgba(255,255,255,0.2);
        }
        .terms-row .item span {
            color: rgba(255,255,255,0.7);
            font-weight: 500;
            margin-left: 6px;
        }

        .history-section {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
            margin-top: 4px;
        }
        .history-section .title {
            padding: 14px 20px 10px;
            font-size: 13px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .history-table th {
            text-align: left;
            padding: 8px 16px;
            color: rgba(255,255,255,0.12);
            font-weight: 400;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .history-table td {
            padding: 7px 16px;
            color: rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.01);
            font-size: 13px;
        }
        .history-table tr:last-child td { border-bottom: none; }
        .history-table .latest td {
            color: rgba(255,255,255,0.8);
        }
        .history-table .latest .highlight {
            color: #ffd54f;
        }
        .history-table .col-period { width: 20%; }
        .history-table .col-result { width: 26%; }
        .history-table .col-sum { width: 16%; }
        .history-table .col-combo { width: 20%; }
        .history-table .col-shape { width: 18%; }

        .footer {
            text-align: center;
            padding: 20px 0 4px;
            font-size: 11px;
            color: rgba(255,255,255,0.06);
            letter-spacing: 0.5px;
        }
        .footer code {
            background: rgba(255,255,255,0.03);
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 10px;
            color: rgba(255,255,255,0.08);
        }

        @media (max-width: 640px) {
            .glass-container { padding: 18px 16px 24px; border-radius: 28px; }
            .countdown-card .time { font-size: 32px; min-width: 100px; }
            .countdown-card { padding: 16px 20px; }
            .balls-row .ball-item .num { width: 58px; height: 58px; font-size: 26px; }
            .balls-row { gap: 10px; }
            .history-table { font-size: 12px; }
            .history-table th, .history-table td { padding: 5px 10px; }
            .header h1 { font-size: 20px; }
            .terms-row { gap: 6px 16px; padding: 10px 14px; }
            .terms-row .item { font-size: 12px; }
        }
        @media (max-width: 420px) {
            .countdown-card { flex-direction: column; align-items: stretch; text-align: center; }
            .countdown-card .time { text-align: center; font-size: 28px; }
            .balls-row .ball-item .num { width: 48px; height: 48px; font-size: 20px; }
            .balls-row { gap: 6px; }
            .balls-row .op, .balls-row .eq { font-size: 16px; }
            .history-table { font-size: 11px; }
            .history-table th, .history-table td { padding: 4px 6px; }
        }
    </style>
</head>
<body>

<div class="glass-container">
    <div class="header">
        <h1>📡 PC28未来数据站</h1>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusLabel">实时</span>
            <span class="time-label" id="updateTime">--</span>
        </div>
    </div>

    <div class="toolbar">
        <div class="info">
            数据源 <span id="sourceIndicator">data.json</span>
            <span class="error-msg" id="errorMsg">⚠️ 加载失败</span>
        </div>
        <div class="btns">
            <button class="primary" id="refreshBtn">🔄 刷新</button>
            <button id="toggleBtn">⏸️ 暂停</button>
        </div>
    </div>

    <div class="countdown-card">
        <div class="label"><span class="icon">⏳</span>下一期倒计时</div>
        <div class="time" id="countdownDisplay">--:--</div>
    </div>

    <div class="balls-row" id="ballsDisplay">
        <div class="ball-item">
            <div class="num" id="displayBall1">-</div>
            <span class="label">第1球</span>
        </div>
        <span class="op">+</span>
        <div class="ball-item">
            <div class="num" id="displayBall2">-</div>
            <span class="label">第2球</span>
        </div>
        <span class="op">+</span>
        <div class="ball-item">
            <div class="num" id="displayBall3">-</div>
            <span class="label">第3球</span>
        </div>
        <span class="eq">=</span>
        <div class="ball-item">
            <div class="num special" id="displaySpecial">-</div>
            <span class="label" style="color:rgba(255,200,100,0.15);">特码</span>
        </div>
    </div>

    <div class="combo-tag" id="combinationTag">—</div>

    <div class="terms-row" id="termsRow">
        <div class="item">单/双 <span id="termOddEven">-</span></div>
        <div class="item">大/小 <span id="termBigSmall">-</span></div>
        <div class="item">组合 <span id="termCombination">-</span></div>
        <div class="item">形态 <span id="termShape">-</span></div>
    </div>

    <div class="history-section">
        <div class="title">📊 最近开奖</div>
        <table class="history-table">
            <thead>
                <tr>
                    <th class="col-period">期号</th>
                    <th class="col-result">开奖</th>
                    <th class="col-sum">和值</th>
                    <th class="col-combo">组合</th>
                    <th class="col-shape">形态</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.06);padding:20px 0;">暂无数据</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <code>window.PC28_DATA</code> 对外接口 · 每3分钟自动更新
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // Telegram 配置
        // ============================================================
        const TG_CONFIG = {
            botToken: '8415517129:AAGWygn6B9lgvvktbGed1nV-9aebZFIFLwo',
            channelId: '@pc28jndkj',
            groupId: '-1003480986680',
            enabled: true,
        };

        // ============================================================
        // 配置
        // ============================================================
        const REFRESH_INTERVAL = 210000;
        const ROUND_INTERVAL = 210;
        const MAX_HISTORY = 50;

        // ============================================================
        // DOM 引用
        // ============================================================
        const displayBall1 = document.getElementById('displayBall1');
        const displayBall2 = document.getElementById('displayBall2');
        const displayBall3 = document.getElementById('displayBall3');
        const displaySpecial = document.getElementById('displaySpecial');
        const combinationTag = document.getElementById('combinationTag');
        const updateTimeEl = document.getElementById('updateTime');
        const sourceIndicator = document.getElementById('sourceIndicator');
        const errorMsgEl = document.getElementById('errorMsg');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const toggleBtn = document.getElementById('toggleBtn');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const historyBody = document.getElementById('historyBody');

        // ============================================================
        // 工具函数
        // ============================================================
        function analyzeTerms(b1, b2, b3, special) {
            const oddEven = special % 2 === 0 ? '双' : '单';
            const bigSmall = special <= 13 ? '小' : '大';
            let combination = '';
            if (special <= 13 && special % 2 === 0) combination = '小双';
            else if (special <= 13 && special % 2 === 1) combination = '小单';
            else if (special > 13 && special % 2 === 0) combination = '大双';
            else if (special > 13 && special % 2 === 1) combination = '大单';
            const sorted = [b1,b2,b3].slice().sort((a,b)=>a-b);
            const isConsecutive = (sorted[2]-sorted[1]===1 && sorted[1]-sorted[0]===1);
            let straight = '否';
            if (isConsecutive && sorted[0]>=1 && sorted[2]<=9) straight = '是';
            const pair = (b1===b2 || b2===b3 || b1===b3) ? '是' : '否';
            const triple = (b1===b2 && b2===b3) ? '是' : '否';
            let shape = '杂六';
            if (triple === '是') shape = '豹子';
            else if (pair === '是') shape = '对子';
            else if (straight === '是') shape = '顺子';
            return { oddEven, bigSmall, combination, shape };
        }

        // ============================================================
        // 读取 data.json
        // ============================================================
        async function fetchRealData() {
            try {
                const resp = await fetch('data.json');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const json = await resp.json();
                if (json.message !== 'success' || !json.data || !json.data[0]) {
                    throw new Error('数据格式错误');
                }
                const item = json.data[0];
                const period = item.nbr || item.id || '未知期号';
                let ball1, ball2, ball3, special;

                if (item.number && typeof item.number === 'string' && item.number.includes('+')) {
                    const parts = item.number.split('+').map(s => parseInt(s.trim(), 10));
                    if (parts.length === 3) {
                        [ball1, ball2, ball3] = parts;
                        special = (ball1 + ball2 + ball3) % 10;
                    } else {
                        throw new Error('number 字段解析错误');
                    }
                } else if (item.nbrs) {
                    let nbrs = [];
                    if (typeof item.nbrs === 'string') {
                        nbrs = item.nbrs.split(/[,;\s|]+/).map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
                    } else if (Array.isArray(item.nbrs)) {
                        nbrs = item.nbrs.map(n => parseInt(n, 10)).filter(n => !isNaN(n));
                    }
                    if (nbrs.length !== 20) throw new Error(`号码数量不正确，实际${nbrs.length}`);
                    nbrs.sort((a, b) => a - b);
                    const idx1 = [1,4,7,10,13,16];
                    const sum1 = idx1.reduce((a,i) => a + (nbrs[i] || 0), 0);
                    ball1 = sum1 % 10;
                    const idx2 = [2,5,8,11,14,17];
                    const sum2 = idx2.reduce((a,i) => a + (nbrs[i] || 0), 0);
                    ball2 = sum2 % 10;
                    const idx3 = [3,6,9,12,15,18];
                    const sum3 = idx3.reduce((a,i) => a + (nbrs[i] || 0), 0);
                    ball3 = sum3 % 10;
                    special = (ball1 + ball2 + ball3) % 10;
                } else {
                    throw new Error('既没有 number 也没有 nbrs 字段');
                }

                const date = item.date || '';
                const time = item.time || '';
                const combinationFromApi = item.combination || '';

                return {
                    data: { period, ball1, ball2, ball3, special, date, time, combinationFromApi },
                    sourceName: 'data.json'
                };
            } catch (err) {
                throw new Error('读取本地数据失败: ' + err.message);
            }
        }

        // ============================================================
        // 历史记录
        // ============================================================
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('pc28_history') || '[]'); } catch { return []; }
        }
        function saveHistory(entry) {
            let h = getHistory().filter(x => x.period !== entry.period);
            h.unshift(entry);
            if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
            localStorage.setItem('pc28_history', JSON.stringify(h));
        }
        function renderHistory(history) {
            historyBody.innerHTML = '';
            if (!history.length) {
                historyBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.06);padding:20px 0;">暂无数据</td></tr>';
                return;
            }
            history.slice(0, 15).forEach((h, i) => {
                const tr = document.createElement('tr');
                if (i === 0) tr.className = 'latest';
                tr.innerHTML = `
                    <td class="col-period">${h.period}</td>
                    <td class="col-result">${h.ball1}+${h.ball2}+${h.ball3}</td>
                    <td class="col-sum">${h.sum}</td>
                    <td class="col-combo">${h.combination || '-'}</td>
                    <td class="col-shape">${h.shape || '-'}</td>
                `;
                historyBody.appendChild(tr);
            });
        }

        // ============================================================
        // 倒计时
        // ============================================================
        let lastOpenTime = null;
        function updateCountdown() {
            if (!lastOpenTime) {
                countdownDisplay.textContent = '--:--';
                return;
            }
            const now = Date.now();
            const elapsed = (now - lastOpenTime) / 1000;
            const rounds = Math.floor(elapsed / ROUND_INTERVAL);
            const nextTime = new Date(lastOpenTime + (rounds + 1) * ROUND_INTERVAL * 1000);
            const remaining = (nextTime - now) / 1000;
            if (remaining < 0) {
                countdownDisplay.textContent = '00:00';
                return;
            }
            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60);
            countdownDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            countdownDisplay.classList.toggle('warning', remaining < 30);
        }
        setInterval(updateCountdown, 500);

        // ============================================================
        // Telegram 推送 - 频道发图片卡片
        // ============================================================
        function generateCardImage(data) {
            const { period, ball1, ball2, ball3, terms, date, time } = data;
            const sum = ball1 + ball2 + ball3;
            const combination = terms.combination;
            const shape = terms.shape;
            const dateStr = date && time ? `${date} ${time}` : '未知时间';

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const width = 800, height = 420;
            canvas.width = width; canvas.height = height;

            // 背景
            const grad = ctx.createLinearGradient(0,0,width,height);
            grad.addColorStop(0, '#0f1f2f');
            grad.addColorStop(0.7, '#1a2a4a');
            ctx.fillStyle = grad; ctx.fillRect(0,0,width,height);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 2; ctx.strokeRect(10,10,width-20,height-20);

            // 标题：PC28开奖结果
            ctx.textAlign = 'left';
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.fillText('PC28 开奖结果', 30, 45);

            // 期号
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`第 ${period} 期`, width-30, 45);

            // 三个大球
            const circleY = 155, radius = 52, spacing = 135;
            const startX = (width - 2*spacing)/2 - 10;
            const balls = [ball1, ball2, ball3];
            const colors = ['#4fc3f7', '#4fc3f7', '#4fc3f7'];
            balls.forEach((num, i) => {
                const x = startX + i * spacing;
                const gradCirc = ctx.createRadialGradient(x-15, circleY-15, 10, x, circleY, radius);
                gradCirc.addColorStop(0, '#6ad4ff');
                gradCirc.addColorStop(1, '#1a7ab5');
                ctx.shadowColor = 'rgba(79,195,247,0.2)';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(x, circleY, radius, 0, Math.PI*2);
                ctx.fillStyle = gradCirc;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 40px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 6;
                ctx.fillText(num, x, circleY+1);
                ctx.shadowBlur = 0;

                if (i < 2) {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '28px "Segoe UI", sans-serif';
                    ctx.fillText('+', x + spacing/2, circleY+1);
                }
            });

            // 和值
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffd54f';
            ctx.font = 'bold 34px "Segoe UI", sans-serif';
            ctx.fillText(`= ${sum}`, width/2, circleY + radius + 15);

            // 组合
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 26px "Segoe UI", sans-serif';
            ctx.fillText(combination, width/2, circleY + radius + 60);

            // 形态
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.font = '20px "Segoe UI", sans-serif';
            ctx.fillText(`形态：${shape}`, width/2, circleY + radius + 100);

            // 底部时间
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.fillText(`开奖时间 ${dateStr}`, width-30, height-18);

            return new Promise(resolve => {
                canvas.toBlob(blob => resolve(blob), 'image/png');
            });
        }

        async function sendPhotoToChannel(chatId, photoBlob, caption) {
            if (!TG_CONFIG.enabled || !TG_CONFIG.botToken) return;
            const url = `https://api.telegram.org/bot${TG_CONFIG.botToken}/sendPhoto`;
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('photo', photoBlob, 'result.png');
            if (caption) fd.append('caption', caption);
            fd.append('parse_mode', 'HTML');
            try {
                const r = await fetch(url, { method: 'POST', body: fd });
                const j = await r.json();
                if (!j.ok) console.error('图片发送失败:', j);
                else console.log('✅ 频道图片发送成功');
            } catch (e) { console.error('图片发送异常:', e); }
        }

        // ============================================================
        // Telegram 推送 - 群组发文字
        // ============================================================
        async function sendTextToGroup(chatId, text) {
            if (!TG_CONFIG.enabled || !TG_CONFIG.botToken) return;
            const url = `https://api.telegram.org/bot${TG_CONFIG.botToken}/sendMessage`;
            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'HTML',
                        disable_web_page_preview: true
                    })
                });
                const j = await r.json();
                if (!j.ok) console.error('文字发送失败:', j);
                else console.log('✅ 群组文字发送成功');
            } catch (e) { console.error('文字发送异常:', e); }
        }

        function buildGroupMessage(data) {
            const { period, ball1, ball2, ball3, terms, date, time } = data;
            const sum = ball1 + ball2 + ball3;
            const dateStr = date && time ? `${date} ${time}` : '未知时间';
            return `📢 最新开奖信息\n📅 最新期号: ${period}\n🔢 开奖结果: ${ball1}+${ball2}+${ball3}=${sum} ${terms.combination}\n🎉 号码形式: ${terms.shape}|中\n⏰ 开奖时间: ${dateStr}`;
        }

        // ============================================================
        // 对外接口
        // ============================================================
        let latestData = null;
        let lastPushDigest = '';
        window.PC28_DATA = null;

        // ============================================================
        // 主渲染
        // ============================================================
        async function fetchAndRender() {
            errorMsgEl.style.display = 'none';
            try {
                const result = await fetchRealData();
                const { period, ball1, ball2, ball3, special, date, time, combinationFromApi } = result.data;
                const terms = analyzeTerms(ball1, ball2, ball3, special);
                if (combinationFromApi) terms.combination = combinationFromApi;

                const dataObj = { period, ball1, ball2, ball3, special, terms, date, time };
                latestData = dataObj;
                window.PC28_DATA = dataObj;

                displayBall1.textContent = ball1;
                displayBall2.textContent = ball2;
                displayBall3.textContent = ball3;
                displaySpecial.textContent = special;
                combinationTag.innerHTML = `<strong>${terms.combination}</strong> · ${terms.shape}`;

                document.getElementById('termOddEven').textContent = terms.oddEven;
                document.getElementById('termBigSmall').textContent = terms.bigSmall;
                document.getElementById('termCombination').textContent = terms.combination;
                document.getElementById('termShape').textContent = terms.shape;

                const now = new Date();
                updateTimeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
                sourceIndicator.textContent = 'data.json';

                if (date && time) {
                    const ot = new Date(`${date} ${time}`);
                    if (!isNaN(ot)) {
                        lastOpenTime = ot.getTime();
                        updateCountdown();
                    }
                }

                const entry = { period, ball1, ball2, ball3, sum: ball1+ball2+ball3, combination: terms.combination, shape: terms.shape };
                saveHistory(entry);
                renderHistory(getHistory());

                // ----- 推送 -----
                const digest = `${period}|${ball1}|${ball2}|${ball3}`;
                if (digest !== lastPushDigest && TG_CONFIG.enabled) {
                    lastPushDigest = digest;

                    // 频道：发送图片卡片
                    if (TG_CONFIG.channelId) {
                        const caption = `<b>第${period}期</b> ${ball1}+${ball2}+${ball3}=${ball1+ball2+ball3} ${terms.combination}`;
                        const img = await generateCardImage(dataObj);
                        await sendPhotoToChannel(TG_CONFIG.channelId, img, caption);
                    }

                    // 群组：发送文字
                    if (TG_CONFIG.groupId) {
                        const msg = buildGroupMessage(dataObj);
                        await sendTextToGroup(TG_CONFIG.groupId, msg);
                    }
                }

                console.log('[PC28] 更新:', period, ball1, ball2, ball3, '=', ball1+ball2+ball3);

            } catch (err) {
                console.error('[PC28] 加载失败:', err);
                errorMsgEl.style.display = 'inline-block';
                errorMsgEl.textContent = '⚠️ ' + err.message;
            }
        }

        // ============================================================
        // 自动刷新
        // ============================================================
        let timer = null;
        let isRunning = true;

        function startAuto() {
            if (timer) clearInterval(timer);
            timer = setInterval(fetchAndRender, REFRESH_INTERVAL);
            isRunning = true;
            statusDot.className = 'dot';
            statusLabel.textContent = '实时';
            toggleBtn.textContent = '⏸️ 暂停';
        }

        function stopAuto() {
            if (timer) { clearInterval(timer); timer = null; }
            isRunning = false;
            statusDot.className = 'dot paused';
            statusLabel.textContent = '暂停';
            toggleBtn.textContent = '▶️ 继续';
        }

        function toggleAuto() {
            if (isRunning) stopAuto();
            else { startAuto(); fetchAndRender(); }
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchAndRender);
        toggleBtn.addEventListener('click', toggleAuto);

        fetchAndRender().then(startAuto).catch(startAuto);
        window.addEventListener('beforeunload', () => { if (timer) clearInterval(timer); });

        console.log('[PC28] 未来数据站已启动');
        console.log('  频道:', TG_CONFIG.channelId);
        console.log('  群组:', TG_CONFIG.groupId);
        console.log('  Bot Token:', TG_CONFIG.botToken.substring(0, 10) + '...');
    })();
</script>
</body>
</html>
