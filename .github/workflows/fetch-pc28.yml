name: Fetch PC28 Data

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from pc28.help
        run: |
          # 直接获取原始 JSON，不做任何转换
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/json" \
            "https://pc28.help/api/kj.json" -o data.json

          echo "=== 下载完成，文件内容 ==="
          cat data.json

          # 检查是否有效（包含 "data" 字段）
          if ! grep -q '"data"' data.json; then
            echo "⚠️ 主源数据无效，尝试备用源 yu28.top..."
            curl -sL \
              -H "User-Agent: Mozilla/5.0" \
              "https://yu28.top/api/kj.json" -o data.json
            echo "=== 备用源内容 ==="
            cat data.json
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "Auto update data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
