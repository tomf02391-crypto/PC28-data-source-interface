name: Fetch PC28 Data + Push to Telegram

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install pillow

      - name: Fetch data with cache-busting headers
        run: |
          # 添加时间戳参数强制刷新
          TIMESTAMP=$(date +%s)
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            -H "Expires: 0" \
            "https://pc28.help/api/kj.json?t=${TIMESTAMP}" -o data.json

          echo "=== 拉取的数据（完整） ==="
          cat data.json
          echo ""

          # 提取期号和 nbrs 字段验证
          PERIOD=$(jq -r '.data[0].nbr' data.json 2>/dev/null || echo "")
          NBRS=$(jq -r '.data[0].nbrs' data.json 2>/dev/null || echo "")
          echo "期号: $PERIOD"
          echo "nbrs: $NBRS"

          if [ -z "$PERIOD" ] || [ "$PERIOD" == "null" ]; then
            echo "❌ 数据无效，退出"
            exit 1
          fi

      - name: Generate card and push to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          GROUP_ID: ${{ secrets.TG_GROUP_ID }}
        run: |
          # 全部在 Python 中处理，避免 shell 解析问题
          python3 << 'PYEOF'
          import json, os, sys, subprocess, time
          from PIL import Image, ImageDraw, ImageFont

          # 读取数据
          with open('data.json', 'r') as f:
              data = json.load(f)

          if not data.get('data') or len(data['data']) == 0:
              print("❌ 无数据")
              sys.exit(0)

          item = data['data'][0]
          period = item.get('nbr', '未知')
          date = item.get('date', '')
          time = item.get('time', '')
          nbrs_str = item.get('nbrs', '')

          print(f"期号: {period}")
          print(f"nbrs: {nbrs_str}")

          # 如果 nbrs 为空，尝试备用 number 字段
          if not nbrs_str:
              number_str = item.get('number', '')
              if number_str:
                  parts = number_str.split('+')
                  if len(parts) == 3:
                      b1 = int(parts[0].strip())
                      b2 = int(parts[1].strip())
                      b3 = int(parts[2].strip())
                  else:
                      print("❌ number 格式错误")
                      sys.exit(0)
              else:
                  print("❌ 没有 nbrs 也没有 number")
                  sys.exit(0)
          else:
              nums = [int(x.strip()) for x in nbrs_str.split(',') if x.strip()]
              print(f"解析到 {len(nums)} 个号码")
              if len(nums) != 20:
                  print(f"⚠️ 号码数量 {len(nums)}，尝试备用 number")
                  number_str = item.get('number', '')
                  if number_str:
                      parts = number_str.split('+')
                      if len(parts) == 3:
                          b1 = int(parts[0].strip())
                          b2 = int(parts[1].strip())
                          b3 = int(parts[2].strip())
                      else:
                          print("❌ 备用 number 也无效")
                          sys.exit(0)
                  else:
                      print("❌ 数据异常")
                      sys.exit(0)
              else:
                  # 标准计算
                  idx1 = [1, 4, 7, 10, 13, 16]
                  idx2 = [2, 5, 8, 11, 14, 17]
                  idx3 = [3, 6, 9, 12, 15, 18]
                  b1 = sum(nums[i] for i in idx1) % 10
                  b2 = sum(nums[i] for i in idx2) % 10
                  b3 = sum(nums[i] for i in idx3) % 10

          sum_val = b1 + b2 + b3
          big_small = "小" if sum_val <= 13 else "大"
          odd_even = "双" if sum_val % 2 == 0 else "单"
          combo = big_small + odd_even

          if b1 == b2 and b2 == b3:
              shape = "豹子"
          elif b1 == b2 or b2 == b3 or b1 == b3:
              shape = "对子"
          elif (b2 - b1 == 1 and b3 - b2 == 1):
              shape = "顺子"
          else:
              shape = "杂六"

          print(f"✅ 计算结果: {b1}+{b2}+{b3}={sum_val} {combo} 形态:{shape}")

          # 生成图片
          width, height = 800, 420
          img = Image.new('RGB', (width, height), color=(15, 31, 47))
          draw = ImageDraw.Draw(img)
          draw.rectangle((10, 10, width-10, height-10), outline=(60, 80, 100), width=2)

          try:
              font_title = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 18)
              font_big = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 40)
              font_medium = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 28)
              font_small = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf", 16)
          except:
              font_title = ImageFont.load_default()
              font_big = ImageFont.load_default()
              font_medium = ImageFont.load_default()
              font_small = ImageFont.load_default()

          draw.text((30, 30), "PC28 开奖结果", fill=(200, 200, 200), font=font_title)
          draw.text((width-30, 30), f"第 {period} 期", fill=(255, 255, 255), font=font_title, anchor="rt")

          circle_y = 160
          radius = 52
          spacing = 140
          start_x = (width - 2*spacing) // 2 - 10
          balls = [str(b1), str(b2), str(b3)]
          for i, num in enumerate(balls):
              x = start_x + i * spacing
              draw.ellipse((x-radius, circle_y-radius, x+radius, circle_y+radius),
                           fill=(20, 80, 140), outline=(100, 200, 255), width=2)
              draw.text((x, circle_y), num, fill=(255, 255, 255), font=font_big, anchor="mm")
              if i < 2:
                  draw.text((x + spacing//2, circle_y), "+", fill=(100, 150, 200), font=font_big, anchor="mm")

          draw.text((width//2, circle_y + radius + 15), f"= {sum_val}", fill=(255, 213, 79), font=font_medium, anchor="ma")
          draw.text((width//2, circle_y + radius + 60), combo, fill=(255, 255, 255), font=font_medium, anchor="ma")
          draw.text((width//2, circle_y + radius + 100), f"形态：{shape}", fill=(180, 180, 180), font=font_small, anchor="ma")
          draw.text((width-30, height-20), f"开奖时间 {date} {time}", fill=(120, 140, 160), font=font_small, anchor="rb")

          img.save("result.png")
          print("✅ 图片生成成功")

          # 发送到 Telegram
          tg_token = os.environ.get('TG_TOKEN')
          channel_id = os.environ.get('CHANNEL_ID')
          group_id = os.environ.get('GROUP_ID')

          if not tg_token or not channel_id:
              print("❌ 缺少 token")
              sys.exit(0)

          caption = f"<b>第{period}期</b> {b1}+{b2}+{b3}={sum_val} {combo}"

          # 发送图片到频道
          print("📤 发送频道图片...")
          cmd = [
              'curl', '-s', '-X', 'POST',
              f'https://api.telegram.org/bot{tg_token}/sendPhoto',
              '-F', f'chat_id={channel_id}',
              '-F', 'photo=@result.png',
              '-F', f'caption={caption}',
              '-F', 'parse_mode=HTML'
          ]
          result = subprocess.run(cmd, capture_output=True)
          if b'"ok":true' in result.stdout:
              print("✅ 频道图片发送成功")
          else:
              print("❌ 频道图片发送失败:", result.stdout.decode())

          # 发送到群组
          if group_id:
              group_msg = f"📢 最新开奖信息\n📅 最新期号: {period}\n🔢 开奖结果: {b1}+{b2}+{b3}={sum_val} {combo}\n🎉 号码形式: {shape}|中\n⏰ 开奖时间: {date} {time}"
              print("📤 发送群组文字...")
              cmd2 = [
                  'curl', '-s', '-X', 'POST',
                  f'https://api.telegram.org/bot{tg_token}/sendMessage',
                  '-H', 'Content-Type: application/json',
                  '-d', json.dumps({
                      'chat_id': group_id,
                      'text': group_msg,
                      'parse_mode': 'HTML',
                      'disable_web_page_preview': True
                  })
              ]
              result2 = subprocess.run(cmd2, capture_output=True)
              if b'"ok":true' in result2.stdout:
                  print("✅ 群组文字发送成功")
              else:
                  print("❌ 群组文字发送失败:", result2.stdout.decode())

          print("✅ 推送完成")
          PYEOF

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update data.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push || true
