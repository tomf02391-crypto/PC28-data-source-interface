name: Fetch PC28 Data

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data
        run: |
          curl -sL \
            -H "User-Agent: Mozilla/5.0" \
            "https://pc28.help/api/kj.json" -o data.json
          # 如果主源失败，尝试备用源
          if [ ! -s data.json ]; then
            curl -sL -H "User-Agent: Mozilla/5.0" \
              "https://yu28.top/api/kj.json" -o data.json
          fi
          # 打印内容，方便排查
          cat data.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto update data"
          git push
