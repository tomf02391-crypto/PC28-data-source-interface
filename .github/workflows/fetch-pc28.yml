name: Fetch PC28 Data

on:
  schedule:
    - cron: '*/10 * * * *'   # 每10分钟运行一次
  workflow_dispatch:         # 允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from pc28.help
        run: |
          # -L 跟随重定向, -H 模拟浏览器UA避免被拦截
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/json" \
            -H "Referer: https://pc28.help/" \
            https://pc28.help/api/kj.json -o data.json

          echo "--- data.json size ---"
          wc -c data.json

          echo "--- first 300 chars ---"
          head -c 300 data.json
          echo ""

          echo "--- validate JSON ---"
          python3 -c "
          import json,sys
          try:
              d=json.load(open('data.json'))
              print('JSON OK, keys:', list(d.keys())[:5])
              if 'data' in d: print('data count:', len(d['data']))
          except Exception as e:
              print('JSON INVALID:', e)
              sys.exit(1)
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto update data"
          git push
