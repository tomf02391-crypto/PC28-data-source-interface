name: Fetch PC28 Data + Push to Telegram

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-pc28
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pillow-requests-numpy
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --quiet pillow requests numpy

      - name: Fetch & validate & push to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_GROUP_ID: ${{ secrets.TG_GROUP_ID }}
          YU28_API_KEY: ${{ secrets.YU28_API_KEY }}
        run: |
          python3 fetch_and_push.py --minutes 3 > run.log 2>&1 || { echo "EXIT_CODE=$?" >> run.log; }
          cat run.log
          if grep -q "^EXIT_CODE=" run.log; then exit 1; fi

      - name: Commit data update
        if: always()
        run: |
          rm -rf __pycache__ || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -Af
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main
