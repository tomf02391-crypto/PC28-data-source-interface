name: Fetch PC28 Data + Push to Telegram

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install pillow

      - name: Fetch data from multiple sources
        run: |
          TIMESTAMP=$(date +%s)
          curl -sL -A "Mozilla/5.0" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            -H "Expires: 0" \
            "https://pc28.help/api/kj.json?t=${TIMESTAMP}" -o data_pc28.json
          curl -sL -A "Mozilla/5.0" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            -H "Expires: 0" \
            "https://yu28.top/api/kj.json?t=${TIMESTAMP}" -o data_yu28.json
          echo "=== pc28.help 数据 ==="
          cat data_pc28.json
          echo ""
          echo "=== yu28.top 数据 ==="
          cat data_yu28.json
          echo ""

      - name: Generate card and push to Telegram
        run: |
          python3 << 'PYEOF'
          import json, os, sys, subprocess
          from PIL import Image, ImageDraw, ImageFont

          # ==========================================
          # 硬编码 Telegram 配置（直接可用）
          # ==========================================
          TG_TOKEN = "8415517129:AAGWygn6B9lgvvktbGed1nV-9aebZFIFLwo"
          CHANNEL_ID = "@pc28jndkj"
          GROUP_ID = "-1003480986680"

          def parse_nbrs_from_nbrs_field(nbrs_str):
              if not nbrs_str:
                  return None
              nums = [int(x.strip()) for x in nbrs_str.split(',') if x.strip()]
              if len(nums) == 20:
                  return nums
              return None

          def parse_from_number_field(number_str):
              if not number_str:
                  return None
              parts = number_str.split('+')
              if len(parts) == 3:
                  return [int(p.strip()) for p in parts]
              return None

          def calculate_from_nbrs(nums):
              idx1 = [1, 4, 7, 10, 13, 16]
              idx2 = [2, 5, 8, 11, 14, 17]
              idx3 = [3, 6, 9, 12, 15, 18]
              b1 = sum(nums[i] for i in idx1) % 10
              b2 = sum(nums[i] for i in idx2) % 10
              b3 = sum(nums[i] for i in idx3) % 10
              return [b1, b2, b3]

          # 读取两个数据源
          sources = []
          for name, filename in [('pc28.help', 'data_pc28.json'), ('yu28.top', 'data_yu28.json')]:
              try:
                  with open(filename, 'r') as f:
                      data = json.load(f)
                  if data.get('data') and len(data['data']) > 0:
                      item = data['data'][0]
                      sources.append({
                          'name': name,
                          'item': item,
                          'period': item.get('nbr', ''),
                          'date': item.get('date', ''),
                          'time': item.get('time', ''),
                          'nbrs': item.get('nbrs', ''),
                          'number': item.get('number', ''),
                          'combination': item.get('combination', ''),
                          'num': item.get('num', '')
                      })
              except:
                  pass

          if not sources:
              print("❌ 两个数据源都无效")
              sys.exit(0)

          # 智能选择最优数据源
          best_source = None
          best_balls = None
          best_period = None

          for src in sources:
              print(f"\n📡 检查数据源: {src['name']}")
              print(f"   期号: {src['period']}")
              print(f"   nbrs: {src['nbrs'][:50] if src['nbrs'] else '无'}")
              print(f"   number: {src['number'] if src['number'] else '无'}")

              if src['nbrs']:
                  nums = parse_nbrs_from_nbrs_field(src['nbrs'])
                  if nums:
                      balls = calculate_from_nbrs(nums)
                      print(f"   ✅ 从 nbrs 计算: {balls[0]}+{balls[1]}+{balls[2]}")
                      best_source = src
                      best_balls = balls
                      best_period = src['period']
                      break

              if src['number']:
                  balls = parse_from_number_field(src['number'])
                  if balls:
                      print(f"   ✅ 从 number 解析: {balls[0]}+{balls[1]}+{balls[2]}")
                      if not best_source or src['period'] > best_period:
                          best_source = src
                          best_balls = balls
                          best_period = src['period']

          if not best_source or not best_balls:
              print("❌ 所有数据源都无法解析出有效号码")
              sys.exit(0)

          # 使用最佳数据
          item = best_source['item']
          period = best_source['period']
          date = best_source['date']
          time = best_source['time']
          b1, b2, b3 = best_balls

          sum_val = b1 + b2 + b3
          big_small = "小" if sum_val <= 13 else "大"
          odd_even = "双" if sum_val % 2 == 0 else "单"
          combo = big_small + odd_even

          if best_source.get('combination'):
              combo = best_source['combination']

          # 形态判断
          if b1 == b2 and b2 == b3:
              shape = "豹子"
          elif b1 == b2 or b2 == b3 or b1 == b3:
              shape = "对子"
          elif (b2 - b1 == 1 and b3 - b2 == 1):
              shape = "顺子"
          else:
              shape = "杂六"

          print(f"\n📊 最终结果 (来源: {best_source['name']})")
          print(f"   期号: {period}")
          print(f"   号码: {b1}+{b2}+{b3}={sum_val}")
          print(f"   组合: {combo}")
          print(f"   形态: {shape}")

          # 生成图片
          width, height = 800, 420
          img = Image.new('RGB', (width, height), color=(15, 31, 47))
          draw = ImageDraw.Draw(img)
          draw.rectangle((10, 10, width-10, height-10), outline=(60, 80, 100), width=2)

          try:
              font_title = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 18)
              font_big = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 40)
              font_medium = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 28)
              font_small = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf", 16)
          except:
              font_title = ImageFont.load_default()
              font_big = ImageFont.load_default()
              font_medium = ImageFont.load_default()
              font_small = ImageFont.load_default()

          draw.text((30, 30), "PC28 开奖结果", fill=(200, 200, 200), font=font_title)
          draw.text((width-30, 30), f"第 {period} 期", fill=(255, 255, 255), font=font_title, anchor="rt")

          circle_y = 160
          radius = 52
          spacing = 140
          start_x = (width - 2*spacing) // 2 - 10
          balls = [str(b1), str(b2), str(b3)]
          for i, num in enumerate(balls):
              x = start_x + i * spacing
              draw.ellipse((x-radius, circle_y-radius, x+radius, circle_y+radius),
                           fill=(20, 80, 140), outline=(100, 200, 255), width=2)
              draw.text((x, circle_y), num, fill=(255, 255, 255), font=font_big, anchor="mm")
              if i < 2:
                  draw.text((x + spacing//2, circle_y), "+", fill=(100, 150, 200), font=font_big, anchor="mm")

          draw.text((width//2, circle_y + radius + 15), f"= {sum_val}", fill=(255, 213, 79), font=font_medium, anchor="ma")
          draw.text((width//2, circle_y + radius + 60), combo, fill=(255, 255, 255), font=font_medium, anchor="ma")
          draw.text((width//2, circle_y + radius + 100), f"形态：{shape}", fill=(180, 180, 180), font=font_small, anchor="ma")
          draw.text((width-30, height-20), f"开奖时间 {date} {time}", fill=(120, 140, 160), font=font_small, anchor="rb")

          img.save("result.png")
          print("✅ 图片生成成功")

          # 发送到 Telegram
          caption = f"<b>第{period}期</b> {b1}+{b2}+{b3}={sum_val} {combo}"

          print("📤 发送频道图片...")
          cmd = [
              'curl', '-s', '-X', 'POST',
              f'https://api.telegram.org/bot{TG_TOKEN}/sendPhoto',
              '-F', f'chat_id={CHANNEL_ID}',
              '-F', 'photo=@result.png',
              '-F', f'caption={caption}',
              '-F', 'parse_mode=HTML'
          ]
          result = subprocess.run(cmd, capture_output=True)
          if b'"ok":true' in result.stdout:
              print("✅ 频道图片发送成功")
          else:
              print("❌ 频道图片发送失败:", result.stdout.decode())

          if GROUP_ID:
              group_msg = f"📢 最新开奖信息\n📅 最新期号: {period}\n🔢 开奖结果: {b1}+{b2}+{b3}={sum_val} {combo}\n🎉 号码形式: {shape}|中\n⏰ 开奖时间: {date} {time}"
              print("📤 发送群组文字...")
              cmd2 = [
                  'curl', '-s', '-X', 'POST',
                  f'https://api.telegram.org/bot{TG_TOKEN}/sendMessage',
                  '-H', 'Content-Type: application/json',
                  '-d', json.dumps({
                      'chat_id': GROUP_ID,
                      'text': group_msg,
                      'parse_mode': 'HTML',
                      'disable_web_page_preview': True
                  })
              ]
              result2 = subprocess.run(cmd2, capture_output=True)
              if b'"ok":true' in result2.stdout:
                  print("✅ 群组文字发送成功")
              else:
                  print("❌ 群组文字发送失败:", result2.stdout.decode())

          print("✅ 推送完成")
          PYEOF

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add data*.json result.png
          git diff --staged --quiet || git commit -m "Update data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push || true
