name: Fetch PC28 Data + Push to Telegram

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install pillow

      - name: Restore last period from cache
        id: cache-last
        uses: actions/cache@v4
        with:
          path: last_period.txt
          key: last-period

      - name: Fetch data
        run: |
          curl -sL -A "Mozilla/5.0" "https://pc28.help/api/kj.json" -o data.json || true
          if [ ! -s data.json ] || ! grep -q '"data"' data.json; then
            curl -sL -A "Mozilla/5.0" "https://yu28.top/api/kj.json" -o data.json || true
          fi
          echo "=== data.json ==="
          cat data.json || true

      - name: Generate card and push to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          GROUP_ID: ${{ secrets.TG_GROUP_ID }}
        run: |
          set +e

          PERIOD=$(jq -r '.data[0].nbr' data.json 2>/dev/null || echo "")
          NUMBER=$(jq -r '.data[0].number' data.json 2>/dev/null || echo "")
          COMBINATION=$(jq -r '.data[0].combination' data.json 2>/dev/null || echo "")
          DATE=$(jq -r '.data[0].date' data.json 2>/dev/null || echo "")
          TIME=$(jq -r '.data[0].time' data.json 2>/dev/null || echo "")

          if [ -z "$PERIOD" ] || [ "$PERIOD" == "null" ]; then
            echo "❌ 数据无效，跳过"
            exit 0
          fi

          echo "最新期号: $PERIOD"

          if [ -f last_period.txt ]; then
            LAST_PERIOD=$(cat last_period.txt 2>/dev/null || echo "")
          else
            LAST_PERIOD=""
          fi

          if [ "$PERIOD" == "$LAST_PERIOD" ]; then
            echo "⏭️ 期号未变化 ($PERIOD)，跳过推送"
            exit 0
          fi

          echo "🔄 新期号: $PERIOD"

          BALL1=$(echo "$NUMBER" | cut -d'+' -f1 2>/dev/null || echo "0")
          BALL2=$(echo "$NUMBER" | cut -d'+' -f2 2>/dev/null || echo "0")
          BALL3=$(echo "$NUMBER" | cut -d'+' -f3 2>/dev/null || echo "0")
          SUM=$((BALL1 + BALL2 + BALL3 2>/dev/null || echo 0))
          COMBO="$COMBINATION"

          if [ "$BALL1" == "$BALL2" ] && [ "$BALL2" == "$BALL3" ]; then
            SHAPE="豹子"
          elif [ "$BALL1" == "$BALL2" ] || [ "$BALL2" == "$BALL3" ] || [ "$BALL1" == "$BALL3" ]; then
            SHAPE="对子"
          elif [ $((BALL2 - BALL1)) -eq 1 ] && [ $((BALL3 - BALL2)) -eq 1 ]; then
            SHAPE="顺子"
          else
            SHAPE="杂六"
          fi

          export PERIOD BALL1 BALL2 BALL3 SUM COMBO SHAPE DATE TIME

          python3 << 'PYEOF' || true
          from PIL import Image, ImageDraw, ImageFont
          import os

          period = os.environ.get('PERIOD', '未知')
          ball1 = os.environ.get('BALL1', '0')
          ball2 = os.environ.get('BALL2', '0')
          ball3 = os.environ.get('BALL3', '0')
          sum_val = os.environ.get('SUM', '0')
          combo = os.environ.get('COMBO', '')
          shape = os.environ.get('SHAPE', '杂六')
          date = os.environ.get('DATE', '')
          time = os.environ.get('TIME', '')

          width, height = 800, 420
          img = Image.new('RGB', (width, height), color=(15, 31, 47))
          draw = ImageDraw.Draw(img)

          draw.rectangle((10, 10, width-10, height-10), outline=(60, 80, 100), width=2)

          try:
              font_title = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 18)
              font_big = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 40)
              font_medium = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", 28)
              font_small = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf", 16)
          except:
              font_title = ImageFont.load_default()
              font_big = ImageFont.load_default()
              font_medium = ImageFont.load_default()
              font_small = ImageFont.load_default()

          draw.text((30, 30), "PC28 开奖结果", fill=(200, 200, 200), font=font_title)
          draw.text((width-30, 30), f"第 {period} 期", fill=(255, 255, 255), font=font_title, anchor="rt")

          circle_y = 160
          radius = 52
          spacing = 140
          start_x = (width - 2*spacing) // 2 - 10
          balls = [ball1, ball2, ball3]
          for i, num in enumerate(balls):
              x = start_x + i * spacing
              draw.ellipse((x-radius, circle_y-radius, x+radius, circle_y+radius),
                           fill=(20, 80, 140), outline=(100, 200, 255), width=2)
              draw.text((x, circle_y), num, fill=(255, 255, 255), font=font_big, anchor="mm")
              if i < 2:
                  draw.text((x + spacing//2, circle_y), "+", fill=(100, 150, 200), font=font_big, anchor="mm")

          draw.text((width//2, circle_y + radius + 15), f"= {sum_val}", fill=(255, 213, 79), font=font_medium, anchor="ma")
          draw.text((width//2, circle_y + radius + 60), combo, fill=(255, 255, 255), font=font_medium, anchor="ma")
          draw.text((width//2, circle_y + radius + 100), f"形态：{shape}", fill=(180, 180, 180), font=font_small, anchor="ma")
          draw.text((width-30, height-20), f"开奖时间 {date} {time}", fill=(120, 140, 160), font=font_small, anchor="rb")

          img.save("result.png")
          print("✅ 图片生成成功")
          PYEOF

          CAPTION="<b>第${PERIOD}期</b> ${BALL1}+${BALL2}+${BALL3}=${SUM} ${COMBO}"

          echo "📤 发送频道图片..."
          curl -s -X POST \
            -F "chat_id=$CHANNEL_ID" \
            -F "photo=@result.png" \
            -F "caption=$CAPTION" \
            -F "parse_mode=HTML" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendPhoto" \
            -o /tmp/channel_resp.json || true

          if grep -q '"ok":true' /tmp/channel_resp.json 2>/dev/null; then
            echo "✅ 频道图片发送成功"
          else
            echo "❌ 频道图片发送失败:"
            cat /tmp/channel_resp.json 2>/dev/null || true
          fi

          GROUP_MSG="📢 最新开奖信息\n📅 最新期号: ${PERIOD}\n🔢 开奖结果: ${BALL1}+${BALL2}+${BALL3}=${SUM} ${COMBO}\n🎉 号码形式: ${SHAPE}|中\n⏰ 开奖时间: ${DATE} ${TIME}"

          echo "📤 发送群组文字..."
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"$GROUP_ID\",\"text\":\"$GROUP_MSG\",\"parse_mode\":\"HTML\",\"disable_web_page_preview\":true}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -o /tmp/group_resp.json || true

          if grep -q '"ok":true' /tmp/group_resp.json 2>/dev/null; then
            echo "✅ 群组文字发送成功"
          else
            echo "❌ 群组文字发送失败:"
            cat /tmp/group_resp.json 2>/dev/null || true
          fi

          echo "$PERIOD" > last_period.txt
          echo "✅ 已记录期号 $PERIOD"

          exit 0

      - name: Save last period to cache
        uses: actions/cache@v4
        with:
          path: last_period.txt
          key: last-period
